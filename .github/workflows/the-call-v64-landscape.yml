name: The Call v64 doubled imported planters, exterior clearance
on:
  pull_request:
    branches: [main]
    paths:
      - 'opening/landscape-layout-v64.mjs'
      - 'opening/landscape-scale-v64.js'
      - 'opening/intro-v64.js'
      - 'review/the-call-v34/index.html'
      - 'scripts/*landscape-v64.mjs'
      - '.github/workflows/the-call-v64-landscape.yml'
  push:
    branches: [main]
    paths:
      - 'opening/landscape-layout-v64.mjs'
      - 'opening/landscape-scale-v64.js'
      - 'opening/intro-v64.js'
      - 'review/the-call-v34/index.html'
      - 'scripts/*landscape-v64.mjs'
      - '.github/workflows/the-call-v64-landscape.yml'
permissions:
  contents: read
jobs:
  double-size-landscaping:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate size, spacing, and untouched original models
        run: |
          node --check opening/landscape-layout-v64.mjs
          node --check opening/landscape-scale-v64.js
          node --check opening/intro-v64.js
          node scripts/audit-opening-landscape-v63.mjs
          node scripts/audit-opening-landscape-v64.mjs
      - name: Install deterministic Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve v64 preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v64-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/review/the-call-v34/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify twofold imported model scale on desktop and mobile
        run: node scripts/smoke-opening-landscape-v64.mjs
      - name: Save larger-planter screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v64-large-modelled-planters
          path: opening-v64-artifacts/
          retention-days: 7
