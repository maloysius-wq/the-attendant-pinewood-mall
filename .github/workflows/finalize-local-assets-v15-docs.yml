name: Finalize Local Assets v15 docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-local-assets-v15-docs.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update handoff and licensing checkpoint
        run: python3 .github/scripts/finalize-local-assets-v15-docs.py
      - name: Commit documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md LICENSES.md
          git diff --cached --check
          git commit -m "Record verified Local Assets v15 checkpoint"
          git push origin HEAD:main
