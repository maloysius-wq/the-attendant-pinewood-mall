name: Finalize Pinewood cleanup rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-local-assets-v15-docs.yml'
      - '.github/scripts/finalize-local-assets-v15-docs.py'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply permanent project rules
        run: python3 .github/scripts/finalize-local-assets-v15-docs.py
      - name: Commit project documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md DEVELOPMENT_HANDOFF.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Project rules already current."
            exit 0
          fi
          git commit -m "Make no-WASD verification rule permanent"
          git push origin HEAD:main
