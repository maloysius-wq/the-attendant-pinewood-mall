name: Pinewood V127 original staff and service subdivisions
on:
  pull_request:
    branches: [main]
    paths:
      - 'mall/staff-service-plan-v127.mjs'
      - 'mall/render-staff-service-v127.js'
      - 'mall/physical-shell-v67.mjs'
      - 'mall/render-shell-v67.js'
      - 'mall/gameplay-layout-v70.mjs'
      - 'review/mall-construction-v67/**'
      - 'scripts/test-staff-service-v127.mjs'
      - 'scripts/smoke-staff-service-v127.mjs'
      - '.github/workflows/staff-service-v127.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-and-desktop-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original staff architecture and chapter routes
        run: |
          node --check mall/staff-service-plan-v127.mjs
          node --check mall/render-staff-service-v127.js
          node --check mall/physical-shell-v67.mjs
          node --check mall/render-shell-v67.js
          node --check mall/gameplay-layout-v70.mjs
          node --check review/mall-construction-v67/main.js
          node --test scripts/test-staff-service-v127.mjs scripts/test-vestibule-checkpoint-v117.mjs scripts/test-sealed-bays-v116.mjs scripts/test-physical-shell-v67.mjs scripts/test-gameplay-layout-v70.mjs scripts/test-story-placement-v70.mjs
      - name: Enforce local-only runtime assets
        run: node scripts/audit-local-assets-v15.mjs
      - name: Install desktop Chromium and software WebGL
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve true canonical mall and game assets
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v127-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/review/mall-construction-v67/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture seven original source-rendered 1440x900 desktop views
        run: node scripts/smoke-staff-service-v127.mjs
      - name: Retain real source screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v127-staff-service-original-desktop-3d
          path: artifacts/v127-staff-service/
          retention-days: 14
