name: Pinewood v81 storm clouds, dying planters, natural keypad curl
on:
  pull_request:
    branches: [main]
    paths:
      - 'opening/**'
      - 'scripts/*storm-decay-v81.mjs'
      - '.github/workflows/storm-and-decay-v81.yml'
  push:
    branches: [main]
    paths:
      - 'opening/**'
      - 'scripts/*storm-decay-v81.mjs'
      - '.github/workflows/storm-and-decay-v81.yml'
permissions:
  contents: read
jobs:
  v81-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source, model and asset contracts
        run: |
          node --check opening/keypad-reach-v72.js
          node --check opening/scene.js
          node --check opening/landscape-v63.js
          node --check opening/intro-v65.js
          node --test scripts/test-storm-decay-v81.mjs
      - name: Install desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve local previews
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v81-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/review/the-call-v34/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test actual textured night, neglected authentic planters, and curled native pointing fingers
        run: node scripts/smoke-storm-decay-v81.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinewood-v81-storm-decay-desktop
          path: storm-v81-artifacts/
          if-no-files-found: ignore
