name: Chapter 4 East Wing regression

on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'patches/chapter4-east-wing-v23.js.txt'
      - 'patches/chapter4-east-wing-readability-v23b.js.txt'
      - 'story/**'
      - 'scripts/audit-chapter3-security-readability-v22d.mjs'
      - 'scripts/audit-chapter4-east-wing-v23.mjs'
      - 'scripts/audit-chapter4-east-wing-readability-v23b.mjs'
      - 'scripts/capture-east-wing-v23.mjs'
      - '.github/workflows/staged-east-wing-v23-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'game.js'
      - 'patches/chapter4-east-wing-v23.js.txt'
      - 'patches/chapter4-east-wing-readability-v23b.js.txt'
      - 'story/**'
      - 'scripts/audit-chapter3-security-readability-v22d.mjs'
      - 'scripts/audit-chapter4-east-wing-v23.mjs'
      - 'scripts/audit-chapter4-east-wing-readability-v23b.mjs'
      - 'scripts/capture-east-wing-v23.mjs'
      - '.github/workflows/staged-east-wing-v23-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  east-wing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Chapter 4 source and loader feed-forward
        run: node scripts/audit-chapter4-east-wing-readability-v23b.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinewood-v23-http.log 2>&1 &
          echo $! > /tmp/pinewood-v23-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pinewood-v23-http.log
          exit 1
      - name: Capture live East Wing views
        run: node scripts/capture-east-wing-v23.mjs
      - name: Upload East Wing screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-east-wing-v23b-live
          path: east-wing-artifacts
          if-no-files-found: warn
          retention-days: 14
