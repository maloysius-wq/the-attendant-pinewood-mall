name: Staged Chapter 4 East Wing regression

on:
  push:
    branches: [main]
    paths:
      - 'patches/chapter4-east-wing-v23.js.txt'
      - 'story/**'
      - 'scripts/audit-chapter3-security-readability-v22d.mjs'
      - 'scripts/audit-chapter4-east-wing-v23.mjs'
      - 'scripts/capture-east-wing-v23.mjs'
      - '.github/workflows/staged-east-wing-v23-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-east-wing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged v23 source
        run: node scripts/audit-chapter4-east-wing-v23.mjs
      - name: Temporarily wire v23 in runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def once(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected one marker, found {n}')
              return text.replace(old,new,1)
          p=Path('game.js'); s=p.read_text()
          s=once(s,"const CHAPTER3_V22D_PATCH='./patches/chapter3-security-readability-v22d.js.txt';\nconst PCAS_VOICE_MANIFEST='./assets/audio/pa/manifest.json';","const CHAPTER3_V22D_PATCH='./patches/chapter3-security-readability-v22d.js.txt';\nconst CHAPTER4_V23_PATCH='./patches/chapter4-east-wing-v23.js.txt';\nconst PCAS_VOICE_MANIFEST='./assets/audio/pa/manifest.json';",'constant')
          s=once(s,"\nfunction replaceFoodCourt(source,replacement){","\nasync function applyChapter4EastWingV23Runtime(source,patchText){\n  const patchUrl=URL.createObjectURL(new Blob([patchText+'\\nexport { applyChapter4EastWingV23 };\\n'],{type:'text/javascript'}));\n  try{const mod=await import(patchUrl);if(typeof mod.applyChapter4EastWingV23!=='function')throw new Error('Chapter 4 The East Wing v23 patch did not export its patch function.');return mod.applyChapter4EastWingV23(source);}finally{URL.revokeObjectURL(patchUrl);}\n}\n\nfunction replaceFoodCourt(source,replacement){",'importer')
          s=once(s,',chapter3V22CPatch,chapter3V22DPatch,pcasVoiceManifestText,localAssetsManifestText,storyModule]',',chapter3V22CPatch,chapter3V22DPatch,chapter4V23Patch,pcasVoiceManifestText,localAssetsManifestText,storyModule]','binding')
          s=once(s,'getText(CHAPTER3_V22C_PATCH),getText(CHAPTER3_V22D_PATCH),getText(PCAS_VOICE_MANIFEST)','getText(CHAPTER3_V22C_PATCH),getText(CHAPTER3_V22D_PATCH),getText(CHAPTER4_V23_PATCH),getText(PCAS_VOICE_MANIFEST)','fetch')
          s=once(s,"  const source=chapter3V22DSource+'\\n//# sourceURL=pinewood-runtime.js\\n';","  const chapter4V23Source=await applyChapter4EastWingV23Runtime(chapter3V22DSource,chapter4V23Patch);\n  const source=chapter4V23Source+'\\n//# sourceURL=pinewood-runtime.js\\n';",'source')
          p.write_text(s)
          PY
      - name: Verify temporary live-chain candidate
        run: node scripts/audit-chapter4-east-wing-v23.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinewood-v23-http.log 2>&1 &
          echo $! > /tmp/pinewood-v23-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pinewood-v23-http.log
          exit 1
      - name: Capture staged East Wing views
        run: node scripts/capture-east-wing-v23.mjs
      - name: Upload East Wing screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-east-wing-v23-staged
          path: east-wing-artifacts
          if-no-files-found: warn
          retention-days: 14
