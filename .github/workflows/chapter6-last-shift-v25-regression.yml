name: Chapter 6 Last Shift v25 regression

on:
  push:
    branches: [chapter6-last-shift-v25]
    paths:
      - 'game.js'
      - 'patches/chapter6-last-shift-v25.js.txt'
      - 'story/**'
      - 'scripts/audit-chapter5-accountability-v24.mjs'
      - 'scripts/audit-chapter6-last-shift-v25.mjs'
      - 'scripts/capture-last-shift-v25.mjs'
      - '.github/workflows/chapter6-last-shift-v25-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  last-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify Chapter 6 v25 live candidate
        run: node scripts/audit-chapter6-last-shift-v25.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinewood-v25-http.log 2>&1 &
          echo $! > /tmp/pinewood-v25-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pinewood-v25-http.log
          exit 1
      - name: Capture Last Shift v25 views
        run: node scripts/capture-last-shift-v25.mjs
      - name: Upload Last Shift screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-last-shift-v25-vertical-slice
          path: last-shift-artifacts
          if-no-files-found: warn
          retention-days: 14
