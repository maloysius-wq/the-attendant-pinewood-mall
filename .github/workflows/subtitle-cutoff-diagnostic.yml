name: Subtitle cutoff diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-base-subtitle-v27.mjs'
      - '.github/workflows/subtitle-cutoff-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print subtitle and audio lifecycle
        run: node scripts/diagnose-base-subtitle-v27.mjs
