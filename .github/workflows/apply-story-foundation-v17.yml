name: Apply Story Foundation v17

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-story-foundation-v17-loader.mjs'
      - '.github/workflows/apply-story-foundation-v17.yml'

permissions:
  contents: write

jobs:
  apply-story-foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire v17 into game loader
        run: node scripts/apply-story-foundation-v17-loader.mjs
      - name: Check loader syntax
        run: node --check game.js
      - name: Commit loader wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          if git diff --cached --quiet; then
            echo "Story Foundation v17 loader is already wired."
            exit 0
          fi
          git commit -m "Wire Story Foundation v17 runtime"
          git pull --rebase origin main
          git push origin HEAD:main
