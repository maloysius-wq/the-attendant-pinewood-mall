name: Pinewood V139 inspect source stealth systems
on:
  push:
    branches: [feature/v139-ch1-authentic-stealth]
    paths:
      - 'mall/chapter1-stealth-v139.js'
      - 'mall/chapter1-stealth-plan-v139.mjs'
      - 'game.js'
      - 'mall/story-placement-v70.mjs'
      - 'scripts/test-chapter1-stealth-v139.mjs'
      - 'scripts/smoke-chapter1-stealth-v139.mjs'
      - 'scripts/inspect-chapter1-stealth-v139.mjs'
      - 'scripts/diagnose-chapter1-stealth-v139.mjs'
      - '.github/workflows/chapter1-stealth-v139.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-stealth-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-chapter1-stealth-v139.mjs
      - run: node scripts/diagnose-chapter1-stealth-v139.mjs
      - run: |
          node --check mall/chapter1-stealth-v139.js
          node --test scripts/test-chapter1-stealth-v139.mjs
          node --test scripts/test-chapter1-objectives-v137.mjs
          node --test scripts/test-chapter1-circuits-v138.mjs
          node scripts/audit-local-assets-v15.mjs

  original-stealth-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locally served desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve the original 3D game with no remote runtime assets
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v139-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Operate real 1979 Fallow cabinet, original decoy and first sighting
        run: node scripts/smoke-chapter1-stealth-v139.mjs
      - name: Retain actual original Chapter 1 WebGL frames and error diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v139-real-source-stealth
          path: artifacts/v139-original-stealth/
          retention-days: 14
