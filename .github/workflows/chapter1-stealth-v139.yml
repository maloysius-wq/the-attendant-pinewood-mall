name: Pinewood V139 inspect source stealth systems
on:
  push:
    branches: [feature/v139-ch1-authentic-stealth]
    paths:
      - 'mall/chapter1-stealth-v139.js'
      - 'mall/chapter1-stealth-plan-v139.mjs'
      - 'game.js'
      - 'mall/story-placement-v70.mjs'
      - 'scripts/test-chapter1-stealth-v139.mjs'
      - 'scripts/smoke-chapter1-stealth-v139.mjs'
      - 'scripts/inspect-chapter1-stealth-v139.mjs'
      - 'scripts/diagnose-chapter1-stealth-v139.mjs'
      - '.github/workflows/chapter1-stealth-v139.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-stealth-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-chapter1-stealth-v139.mjs
      - run: node scripts/diagnose-chapter1-stealth-v139.mjs
      - run: |
          node --check mall/chapter1-stealth-v139.js
          node --test scripts/test-chapter1-stealth-v139.mjs
          node --test scripts/test-chapter1-objectives-v137.mjs
          node --test scripts/test-chapter1-circuits-v138.mjs
          node scripts/audit-local-assets-v15.mjs
