name: Pinewood V161 East Department measured retail rebuild
on:
  push:
    branches: [feature/v161-east-department]
    paths:
      - 'mall/anchor-layout-v121.mjs'
      - 'mall/anchor-stock-layout-v123.mjs'
      - 'mall/furnishing-plan-v69.mjs'
      - 'mall/fallow-cartons-v160.js'
      - 'mall/fallows-sources-v160.mjs'
      - 'mall/render-furnishing-v69.js'
      - 'mall/render-anchor-identity-v122.js'
      - 'mall/physical-shell-v67.mjs'
      - 'mall/gameplay-layout-v70.mjs'
      - 'mall/chapter1-traversal-v143.js'
      - 'mall/render-anchor-retail-v121.js'
      - 'review/mall-construction-v67/main.js'
      - 'scripts/*east-v161.mjs'
      - 'mall/east-stock-v161.js'
      - '.github/workflows/east-v161.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check mall/anchor-layout-v121.mjs
          node --check mall/anchor-stock-layout-v123.mjs
          node --check mall/furnishing-plan-v69.mjs
          node --check review/mall-construction-v67/main.js
          node --check mall/east-stock-v161.js
          node --check mall/render-anchor-identity-v122.js
          node --check mall/fallows-sources-v160.mjs
          node --check mall/render-furnishing-v69.js
          node --check mall/fallow-cartons-v160.js
          node --check mall/render-anchor-retail-v121.js
          node --test scripts/test-east-v161.mjs scripts/test-fallows-v160.mjs scripts/test-anchor-retail-v121.mjs scripts/test-anchor-identity-v122.mjs scripts/test-cassette-castle-v124.mjs scripts/test-anchor-layout-v121.mjs scripts/test-anchor-stock-layout-v123.mjs scripts/test-furnishing-v69.mjs scripts/test-gameplay-layout-v70.mjs scripts/test-visual-anchors-v70.mjs scripts/test-physical-shell-v67.mjs
          node scripts/audit-local-assets-v15.mjs
          node --test scripts/audit-builder-assets-v1.mjs
  actual-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve exact repository files
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v161-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node scripts/smoke-east-v161.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v161-real-east-assembled-desktop
          path: artifacts/v161-east/
          retention-days: 14
  native-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check mall/chapter1-traversal-v143.js
          node --check scripts/smoke-native-east-v161.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve exact repository files
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v161-native-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node scripts/smoke-native-east-v161.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v161-native-east
          path: artifacts/v161-native-east/
          retention-days: 14
