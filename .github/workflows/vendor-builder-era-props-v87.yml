name: Vendor 1990s CRT and abandoned mall props (development only)
on:
  push:
    branches:
      - feat/builder-placement-room-finishes-era-props-v87
    paths:
      - 'tools/vendor-builder-era-props-v87.mjs'
      - '.github/workflows/vendor-builder-era-props-v87.yml'
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-placement-room-finishes-era-props-v87
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/vendor-builder-era-props-v87.mjs
      - name: Pin unchanged original GLBs, source data, SHA-256
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/builder/models/era-v87 assets/vendor/builder/era-catalog-v87.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(builder): pin sourced CRT PC and abandoned mall debris"
            git push origin HEAD:feat/builder-placement-room-finishes-era-props-v87
          fi
