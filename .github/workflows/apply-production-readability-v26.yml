name: Apply production readability v26

on:
  push:
    branches: [production-hardening-pass-v26]
    paths:
      - '.github/workflows/apply-production-readability-v26.yml'
      - 'scripts/apply-production-readability-v26.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-pass-v26
          fetch-depth: 0
      - name: Apply guarded wiring
        run: python3 scripts/apply-production-readability-v26.py
      - name: Commit candidate wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Wire production readability v26 live candidate'
          git push origin HEAD:production-hardening-pass-v26
