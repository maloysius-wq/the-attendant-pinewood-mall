name: Generate Audio Direction v27

on:
  push:
    branches: [audio-direction-v27]
    paths:
      - 'story/pa-lines-v27.json'
      - 'scripts/generate-pcas-voice-v27.mjs'
      - 'scripts/generate-character-voices-v27.mjs'
      - 'scripts/audit-audio-direction-v27.mjs'
      - 'patches/audio-direction-v27.js.txt'
      - '.github/workflows/generate-audio-direction-v27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline voice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate deep PCAS and character voice assets
        run: |
          node scripts/generate-pcas-voice-v27.mjs
          node scripts/generate-character-voices-v27.mjs
      - name: Upload representative voice review clips
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-audio-direction-v27-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/audio/pa/ch1_contractor_registered.ogg
            assets/audio/pa/ambient_ch1_public_exit.ogg
            assets/audio/characters/ch1_start.ogg
            assets/audio/characters/ch4_fake_route.ogg
            assets/audio/characters/ch6_radio_overlap.ogg
            assets/audio/characters/recording_jo_ls06.ogg
            assets/audio/characters/recording_eli_ls08.ogg
            assets/audio/pa/manifest.json
            assets/audio/characters/manifest.json
      - name: Wire v27 after production readability and feed forward v26 audit
        shell: python
        run: |
          from pathlib import Path
          p=Path('game.js'); s=p.read_text()
          def once(old,new,label):
              global s
              if s.count(old)!=1: raise SystemExit(f'{label}: expected one marker, got {s.count(old)}')
              s=s.replace(old,new,1)
          once("const PRODUCTION_READABILITY_V26_PATCH='./patches/production-readability-v26.js.txt';",
               "const PRODUCTION_READABILITY_V26_PATCH='./patches/production-readability-v26.js.txt';\nconst AUDIO_DIRECTION_V27_PATCH='./patches/audio-direction-v27.js.txt';",'v27 patch constant')
          once("const PCAS_VOICE_MANIFEST='./assets/audio/pa/manifest.json';",
               "const PCAS_VOICE_MANIFEST='./assets/audio/pa/manifest.json';\nconst CHARACTER_VOICE_MANIFEST='./assets/audio/characters/manifest.json';",'character manifest constant')
          marker="\nfunction replaceFoodCourt(source,replacement){"
          fn="""\nasync function applyAudioDirectionV27Runtime(source,patchText,manifest){\n  const patchUrl=URL.createObjectURL(new Blob([patchText+'\\nexport { applyAudioDirectionV27 };\\n'],{type:'text/javascript'}));\n  try{const mod=await import(patchUrl);if(typeof mod.applyAudioDirectionV27!=='function')throw new Error('Audio Direction v27 patch did not export its patch function.');return mod.applyAudioDirectionV27(source,manifest);}finally{URL.revokeObjectURL(patchUrl);}\n}\n"""
          once(marker,fn+marker,'v27 apply function')
          once('productionReadabilityV26Patch,pcasVoiceManifestText,localAssetsManifestText,storyModule]',
               'productionReadabilityV26Patch,audioDirectionV27Patch,pcasVoiceManifestText,characterVoiceManifestText,localAssetsManifestText,storyModule]','promise names')
          once('getText(PRODUCTION_READABILITY_V26_PATCH),getText(PCAS_VOICE_MANIFEST),getText(LOCAL_ASSETS_MANIFEST)',
               'getText(PRODUCTION_READABILITY_V26_PATCH),getText(AUDIO_DIRECTION_V27_PATCH),getText(PCAS_VOICE_MANIFEST),getText(CHARACTER_VOICE_MANIFEST),getText(LOCAL_ASSETS_MANIFEST)','promise values')
          once('const pcasVoiceManifest=JSON.parse(pcasVoiceManifestText);',
               'const pcasVoiceManifest=JSON.parse(pcasVoiceManifestText);\n  const characterVoiceManifest=JSON.parse(characterVoiceManifestText);','manifest parse')
          once("  const productionReadabilityV26Source=await applyProductionReadabilityV26Runtime(chapter6V25Source,productionReadabilityV26Patch);\n  const source=productionReadabilityV26Source+'\\n//# sourceURL=pinewood-runtime.js\\n';",
               "  const productionReadabilityV26Source=await applyProductionReadabilityV26Runtime(chapter6V25Source,productionReadabilityV26Patch);\n  const audioDirectionV27Source=await applyAudioDirectionV27Runtime(productionReadabilityV26Source,audioDirectionV27Patch,characterVoiceManifest);\n  const source=audioDirectionV27Source+'\\n//# sourceURL=pinewood-runtime.js\\n';",'terminal source')
          p.write_text(s)

          p=Path('scripts/audit-production-readability-v26.mjs'); s=p.read_text()
          start=s.index("const loader=await readFile('game.js','utf8');")
          end=s.index("\n\nconsole.log",start)
          replacement="""const loader=await readFile('game.js','utf8');
          const live=loader.includes(\"const PRODUCTION_READABILITY_V26_PATCH='./patches/production-readability-v26.js.txt';\");
          if(live){
            for(const marker of ['applyProductionReadabilityV26Runtime','getText(PRODUCTION_READABILITY_V26_PATCH)','const productionReadabilityV26Source=await applyProductionReadabilityV26Runtime(chapter6V25Source,productionReadabilityV26Patch);'])if(!loader.includes(marker))fail('game.js partial/incorrect live v26 marker: '+marker);
            if(loader.includes(\"const source=chapter6V25Source+'\\\\n//# sourceURL=pinewood-runtime.js\\\\n';\"))fail('game.js still terminates at v25 while v26 is present');
            const v27=loader.includes(\"const AUDIO_DIRECTION_V27_PATCH='./patches/audio-direction-v27.js.txt';\");
            if(v27){for(const marker of ['applyAudioDirectionV27Runtime','getText(AUDIO_DIRECTION_V27_PATCH)','const audioDirectionV27Source=await applyAudioDirectionV27Runtime(productionReadabilityV26Source,audioDirectionV27Patch,characterVoiceManifest);',\"const source=audioDirectionV27Source+'\\\\n//# sourceURL=pinewood-runtime.js\\\\n';\"])if(!loader.includes(marker))fail('game.js partial/incorrect v27 feed-forward marker: '+marker);}
            else if(!loader.includes(\"const source=productionReadabilityV26Source+'\\\\n//# sourceURL=pinewood-runtime.js\\\\n';\"))fail('v26 must terminate the loader when no later patch is present');
          }else if(loader.includes('applyProductionReadabilityV26Runtime')||loader.includes('productionReadabilityV26Source'))fail('game.js contains partial v26 wiring');"""
          p.write_text(s[:start]+replacement+s[end:])
      - name: Audit generated audio direction
        run: |
          node scripts/audit-audio-direction-v27.mjs
          node scripts/audit-production-readability-v26.mjs
      - name: Commit generated local voices and runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game.js scripts/audit-production-readability-v26.mjs assets/audio/pa assets/audio/characters
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate v27 voices and wire serialized audio runtime"
          git push
