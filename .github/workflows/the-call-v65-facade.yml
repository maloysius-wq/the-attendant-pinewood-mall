name: The Call v65 boarded abandoned mall facade
on:
  pull_request:
    branches: [main]
    paths:
      - 'opening/scene.js'
      - 'opening/facade-v65.js'
      - 'opening/intro-v65.js'
      - 'opening/camera-v65.js'
      - 'opening/assets/v65/**'
      - 'review/the-call-v34/index.html'
      - 'scripts/*facade-v65.mjs'
      - 'scripts/audit-opening-landscape-v63.mjs'
      - 'scripts/audit-opening-landscape-v64.mjs'
      - '.github/workflows/the-call-v65-facade.yml'
  push:
    branches: [main]
    paths:
      - 'opening/scene.js'
      - 'opening/facade-v65.js'
      - 'opening/intro-v65.js'
      - 'opening/camera-v65.js'
      - 'opening/assets/v65/**'
      - 'review/the-call-v34/index.html'
      - 'scripts/*facade-v65.mjs'
      - 'scripts/audit-opening-landscape-v63.mjs'
      - 'scripts/audit-opening-landscape-v64.mjs'
      - '.github/workflows/the-call-v65-facade.yml'
permissions:
  contents: read
jobs:
  abandoned-mall-facade:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code syntax, CC0 manifest, preserved older review geometry
        run: |
          node --check opening/scene.js
          node --check opening/facade-v65.js
          node --check opening/intro-v65.js
          node --check opening/camera-v65.js
          node --check scripts/audit-opening-facade-v65.mjs
          node --check scripts/smoke-opening-facade-v65.mjs
          node scripts/audit-opening-landscape-v63.mjs
          node scripts/audit-opening-landscape-v64.mjs
          node scripts/audit-opening-facade-v65.mjs
      - name: Install deterministic Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve review-only v65
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v65-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/review/the-call-v34/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify preload, servicedoor unchanged, real wood, and v64 planters on desktop/mobile
        run: node scripts/smoke-opening-facade-v65.mjs
      - name: Save v65 screenshots and QA manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v65-abandoned-mall-facade
          path: opening-v65-artifacts/
          retention-days: 7
