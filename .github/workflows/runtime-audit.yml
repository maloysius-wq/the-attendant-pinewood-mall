name: Runtime audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game.js'
      - 'bundle2/**'
      - 'patches/**'
      - 'story/**'
      - 'assets/vendor/runtime/**'
      - 'assets/audio/pa/**'
      - 'vendor/**'
      - 'scripts/generate-pcas-voice.mjs'
      - 'scripts/audit-runtime.mjs'
      - 'scripts/audit-footstep-mix-v11.mjs'
      - 'scripts/audit-poster-diversity-v12.mjs'
      - 'scripts/audit-cassette-castle-v13.mjs'
      - 'scripts/audit-cassette-castle-v14.mjs'
      - 'scripts/audit-local-assets-v15.mjs'
      - 'scripts/audit-retail-geometry-v16.mjs'
      - 'scripts/audit-story-foundation-v17.mjs'
      - 'scripts/audit-chapter1-story-v18.mjs'
      - 'scripts/audit-pcas-voice-v19.mjs'
      - 'scripts/audit-chapter1-pcas-v20.mjs'
      - 'scripts/audit-chapter2-below-grade-v21.mjs'
      - '.github/workflows/runtime-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'game.js'
      - 'bundle2/**'
      - 'patches/**'
      - 'story/**'
      - 'assets/vendor/runtime/**'
      - 'assets/audio/pa/**'
      - 'vendor/**'
      - 'scripts/generate-pcas-voice.mjs'
      - 'scripts/audit-runtime.mjs'
      - 'scripts/audit-footstep-mix-v11.mjs'
      - 'scripts/audit-poster-diversity-v12.mjs'
      - 'scripts/audit-cassette-castle-v13.mjs'
      - 'scripts/audit-cassette-castle-v14.mjs'
      - 'scripts/audit-local-assets-v15.mjs'
      - 'scripts/audit-retail-geometry-v16.mjs'
      - 'scripts/audit-story-foundation-v17.mjs'
      - 'scripts/audit-chapter1-story-v18.mjs'
      - 'scripts/audit-pcas-voice-v19.mjs'
      - 'scripts/audit-chapter1-pcas-v20.mjs'
      - 'scripts/audit-chapter2-below-grade-v21.mjs'
      - '.github/workflows/runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and validate deployed runtime
        run: node scripts/audit-runtime.mjs
      - name: Validate footstep mix v11
        run: node scripts/audit-footstep-mix-v11.mjs
      - name: Validate poster diversity v12
        run: node scripts/audit-poster-diversity-v12.mjs
      - name: Validate Cassette Castle v13
        run: node scripts/audit-cassette-castle-v13.mjs
      - name: Validate Cassette Castle v14
        run: node scripts/audit-cassette-castle-v14.mjs
      - name: Validate local runtime assets v15
        run: node scripts/audit-local-assets-v15.mjs
      - name: Validate retail geometry v16
        run: node scripts/audit-retail-geometry-v16.mjs
      - name: Validate story foundation v17
        run: node scripts/audit-story-foundation-v17.mjs
      - name: Validate Chapter 1 Story v18
        run: node scripts/audit-chapter1-story-v18.mjs
      - name: Validate distorted PCAS voice v19
        run: node scripts/audit-pcas-voice-v19.mjs
      - name: Validate Chapter 1 PCAS escalation v20
        run: node scripts/audit-chapter1-pcas-v20.mjs
      - name: Validate Chapter 2 Below Grade v21
        run: node scripts/audit-chapter2-below-grade-v21.mjs

# Verification checkpoint: corrected staged Below Grade v21 patch
