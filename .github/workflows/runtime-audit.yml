name: Runtime audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game.js'
      - 'bundle2/**'
      - 'patches/**'
      - 'assets/vendor/runtime/**'
      - 'vendor/**'
      - 'scripts/audit-runtime.mjs'
      - 'scripts/audit-footstep-mix-v11.mjs'
      - 'scripts/audit-poster-diversity-v12.mjs'
      - 'scripts/audit-cassette-castle-v13.mjs'
      - 'scripts/audit-cassette-castle-v14.mjs'
      - 'scripts/audit-local-assets-v15.mjs'
      - 'scripts/audit-retail-geometry-v16.mjs'
      - '.github/workflows/runtime-audit.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'game.js'
      - 'bundle2/**'
      - 'patches/**'
      - 'assets/vendor/runtime/**'
      - 'vendor/**'
      - 'scripts/audit-runtime.mjs'
      - 'scripts/audit-footstep-mix-v11.mjs'
      - 'scripts/audit-poster-diversity-v12.mjs'
      - 'scripts/audit-cassette-castle-v13.mjs'
      - 'scripts/audit-cassette-castle-v14.mjs'
      - 'scripts/audit-local-assets-v15.mjs'
      - 'scripts/audit-retail-geometry-v16.mjs'
      - '.github/workflows/runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and validate deployed runtime
        run: node scripts/audit-runtime.mjs
      - name: Validate footstep mix v11
        run: node scripts/audit-footstep-mix-v11.mjs
      - name: Validate poster diversity v12
        run: node scripts/audit-poster-diversity-v12.mjs
      - name: Validate Cassette Castle v13
        run: node scripts/audit-cassette-castle-v13.mjs
      - name: Validate Cassette Castle v14
        run: node scripts/audit-cassette-castle-v14.mjs
      - name: Validate local runtime assets v15
        run: node scripts/audit-local-assets-v15.mjs
      - name: Validate retail geometry v16
        run: node scripts/audit-retail-geometry-v16.mjs

# Verification trigger: retail geometry v16 deep-dive gate
