name: Vendor original rigged CC0 hand v47
on:
  push:
    branches: [feature/the-call-v47-cc0-rigged-hand]
    paths:
      - 'scripts/vendor-hand-v47.mjs'
      - '.github/workflows/vendor-hand-v47.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/the-call-v47-cc0-rigged-hand
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public-domain GLB and verify actual skinned hand joints
        run: node scripts/vendor-hand-v47.mjs
      - name: Commit and pin the original CC0 hand binary to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opening/assets/v47/hand-posable.glb opening/assets/v47/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor original CC0 skinned posable right hand for The Call"
          git push origin HEAD:feature/the-call-v47-cc0-rigged-hand
