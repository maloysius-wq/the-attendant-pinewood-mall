name: Repair v26 audit feed-forward

on:
  push:
    branches: [production-hardening-pass-v26]
    paths:
      - '.github/workflows/repair-audit-feedforward-v26.yml'
      - 'scripts/repair-audit-feedforward-v26.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-pass-v26
          fetch-depth: 0
      - name: Repair historical loader audits
        run: python3 scripts/repair-audit-feedforward-v26.py
      - name: Commit audit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-chapter3-security-readability-v22d.mjs scripts/audit-chapter6-last-shift-v25.mjs
          git diff --cached --check
          git commit -m 'Teach historical audits about v26 feed-forward'
          git push origin HEAD:production-hardening-pass-v26
