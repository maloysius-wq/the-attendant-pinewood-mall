name: Pinewood V153 original finale handler regression
on:
  push:
    branches: [diagnostic/v153-chapter6-startup]
    paths:
      - 'scripts/simulate-chapter6-finale-v25.mjs'
      - '.github/workflows/diagnose-finale-handlers-v153.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-ending:
    strategy:
      fail-fast: false
      matrix:
        ending: [standard, 'true']
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop Chromium
        run: |
          node --check scripts/simulate-chapter6-finale-v25.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve unchanged original runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v153-finale-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Original scripted finale handlers with independent saved evidence fixture
        run: node scripts/simulate-chapter6-finale-v25.mjs ${{ matrix.ending }}
      - name: Archive ending evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v153-finale-${{ matrix.ending }}
          path: artifacts/v153-finale-simulation/
          retention-days: 14
