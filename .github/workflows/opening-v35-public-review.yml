name: Verify public v35 human-eye cinematic
on:
  push:
    branches: [feature/the-call-v35-human-camera-gapless-rain]
    paths: ['.github/workflows/opening-v35-public-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-published-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify Pages preview and live game's separate homepage
        shell: bash
        run: |
          set -euo pipefail
          base=https://maloysius-wq.github.io/the-attendant-pinewood-mall/
          for attempt in $(seq 1 15); do
            curl -fsSL --max-time 20 "$base"review/the-call-v34/ -o /tmp/pinewood-v35.html || true
            if grep -q 'intro.js?v=35' /tmp/pinewood-v35.html; then break; fi
            if [[ "$attempt" = "15" ]]; then echo "v35 Pages HTML unavailable"; exit 1; fi
            sleep 10
          done
          curl -fsSL "$base"opening/camera.js -o /tmp/pinewood-camera.js
          curl -fsSL "$base"opening/audio/car-rain-v35.ogg -o /tmp/car-rain.ogg
          curl -fsSL "$base"opening/audio/outside-rain-v35.ogg -o /tmp/outside-rain.ogg
          curl -fsSL "$base"opening/audio/rain-v35-manifest.json -o /tmp/rain-manifest.json
          test $(wc -c < /tmp/car-rain.ogg) -gt 50000
          test $(wc -c < /tmp/outside-rain.ogg) -gt 25000
          curl -fsSL "$base" -o /tmp/live-home.html
          if grep -q 'id="pwm-opening"' /tmp/live-home.html; then echo 'Production root changed'; exit 1; fi
          echo 'PASS: real Pages v35 review scripts and OGG present; production homepage remains unchanged.'
      - name: Install headless browser
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Exercise human camera, dashboard holder and gapless Web Audio on hosted preview
        env:
          PINEWOOD_BASE_URL: https://maloysius-wq.github.io/the-attendant-pinewood-mall/review/the-call-v34/
        run: node scripts/smoke-opening-v35.mjs
      - name: Record hosted cinematic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-v35-hosted-human-pov
          path: opening/review-v35/*.png
          if-no-files-found: ignore
          retention-days: 3
