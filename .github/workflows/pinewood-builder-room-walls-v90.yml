name: Pinewood Builder all-room wall finish audit v90
on:
  pull_request:
    branches: [main]
    paths:
      - 'builder/**'
      - 'scripts/test-builder-room-walls-v90.mjs'
      - 'scripts/smoke-builder-room-walls-v90.mjs'
      - '.github/workflows/pinewood-builder-room-walls-v90.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wall-finishes:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all 41 physical room wall boundaries and staged exterior doorway
        run: node --test scripts/test-builder-room-walls-v90.mjs scripts/test-builder-v87.mjs
      - name: Preserve fully local Builder asset rule
        run: node --test scripts/audit-builder-assets-v1.mjs
      - name: Install deterministic desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve canonical mall and Builder-only cinematic exterior
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v90-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/builder/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify rendered vestibule front wall, 41-room plan, and finish undo redo
        run: node scripts/smoke-builder-room-walls-v90.mjs
