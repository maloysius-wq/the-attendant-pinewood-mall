name: Pinewood V148 Original Chapter Restart Integrity
on:
  push:
    branches: [feature/v148-chapter1-restart-integrity]
    paths:
      - 'game.js'
      - 'mall/chapter1-restart-v148.js'
      - 'scripts/audit-original-restart-v148.mjs'
      - 'scripts/test-chapter1-restart-v148.mjs'
      - 'scripts/smoke-chapter1-restart-v148.mjs'
      - '.github/workflows/chapter1-restart-v148.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect genuine original Death Restart source contract
        run: |
          node --check mall/chapter1-restart-v148.js
          node --check scripts/smoke-chapter1-restart-v148.mjs
          V148_PRINT_ORIGINAL=1 node scripts/audit-original-restart-v148.mjs
          node --test scripts/test-chapter1-restart-v148.mjs
          node --test scripts/test-chapter1-first-peek-decoy-v147.mjs
          node --test scripts/test-chapter1-recovery-v140.mjs
          node scripts/audit-local-assets-v15.mjs
  genuine-original-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original desktop-only Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve exact original game through localhost
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v148-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run real lethal contact, Death Restart, stage-by-stage snapshot and original replay
        run: node scripts/smoke-chapter1-restart-v148.mjs
      - name: Archive diagnostic timings even if restart does not finish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v148-original-restart-stages
          path: artifacts/v148-real-original-restart/
          retention-days: 14
