name: Pinewood V159 actual arcade layout
on:
  push:
    branches: [feature/v159-sunburst-layout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure source GLB orientation profiles
        run: node scripts/inspect-arcade-orientation-v159.mjs
      - name: Check canonical physical routes, fixtures and local asset pins
        run: |
          node --test scripts/test-sunburst-arcade-v126.mjs scripts/test-furnishing-v69.mjs scripts/test-physical-shell-v67.mjs scripts/test-gameplay-layout-v70.mjs scripts/test-authored-scene-v111.mjs
          node scripts/audit-local-assets-v15.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v159-original-arcade-source-profiles
          path: artifacts/v159-arcade-source/
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve exact committed local assets
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v159-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify full-scale original arcade in actual published assembly
        run: node scripts/smoke-sunburst-arcade-v126.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v159-actual-sunburst
          path: artifacts/v126-sunburst-arcade-real-3d/
