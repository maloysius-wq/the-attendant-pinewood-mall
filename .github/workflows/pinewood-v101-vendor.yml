name: Pinewood v101 temporary CC0 plants and calendar photo archive
on:
  push:
    branches: [feat/builder-v101-mood-calendar-plants-selection]
    paths: ['.github/workflows/pinewood-v101-vendor.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.3.0
      - name: Download original CC0 models and PD calendar photographs and pin transformed calendars
        run: python tools/vendor-mood-v101.py
      - name: Commit files to development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/builder/mood-v101/
          git diff --cached --stat
          test -f assets/vendor/builder/mood-v101/manifest-v101.json
          git commit -m "Vendor real CC0 desk plant geometry and historical photo-calendar wall decor"
          git push origin HEAD:feat/builder-v101-mood-calendar-plants-selection
