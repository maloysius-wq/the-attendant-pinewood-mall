name: Pinewood Builder v98 source-licensed contractor props and wall/ceiling decor
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/vendor/builder/vestibule-v98/**'
      - 'builder/vestibule-catalog-v98.mjs'
      - 'builder/decals-v97.js'
      - 'builder/editor-scene.js'
      - 'builder/main.js'
      - 'scripts/test-builder-vestibule-v98.mjs'
      - 'scripts/smoke-builder-vestibule-v98.mjs'
      - '.github/workflows/pinewood-builder-vestibule-v98.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contractor-vestibule:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-verified Quaternius and authored Pinewood asset hash and schema audit
        run: |
          node --test scripts/test-builder-vestibule-v98.mjs scripts/test-builder-decals-v97.mjs
          node --test scripts/audit-builder-assets-v1.mjs
      - name: Install desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve source-pinned Builder and all new wall/ceiling artwork locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v98-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/builder/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Desktop verify pallet, forklift, new notices, ceiling webs and saved layouts
        run: node scripts/smoke-builder-vestibule-v98.mjs
