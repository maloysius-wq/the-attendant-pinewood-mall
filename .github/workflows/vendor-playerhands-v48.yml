name: Vendor CC0 Playerhands with forearm v48
on:
  push:
    branches: [feature/the-call-v48-cc0-playerhands-forearm]
    paths:
      - 'scripts/vendor-playerhands-v48.mjs'
      - 'scripts/export-playerhands-v48.py'
      - '.github/workflows/vendor-playerhands-v48.yml'
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/the-call-v48-cc0-playerhands-forearm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Blender to preserve original skinned rig
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
      - name: Download and export genuine CC0 OpenGameArt Playerhands
        run: node scripts/vendor-playerhands-v48.mjs
      - name: Commit forearm-hand GLB and pinned provenance to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opening/assets/v48/playerhands-forearm.glb opening/assets/v48/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Vendor CC0 OpenGameArt Playerhands forearm and rig"
          git fetch origin feature/the-call-v48-cc0-playerhands-forearm
          git rebase origin/feature/the-call-v48-cc0-playerhands-forearm
          git push origin HEAD:feature/the-call-v48-cc0-playerhands-forearm
