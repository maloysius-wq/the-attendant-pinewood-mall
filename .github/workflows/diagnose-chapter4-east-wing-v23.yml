name: Diagnose Chapter 4 East Wing v23

on:
  push:
    branches: [main]
    paths:
      - 'patches/chapter4-east-wing-v23.js.txt'
      - 'scripts/audit-chapter4-east-wing-v23.mjs'
      - '.github/workflows/diagnose-chapter4-east-wing-v23.yml'
      - 'story/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Chapter 4 East Wing v23
        shell: bash
        run: node scripts/audit-chapter4-east-wing-v23.mjs 2>&1 | tee chapter4-v23-audit.log
      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: chapter4-v23-audit
          path: chapter4-v23-audit.log
          if-no-files-found: error
          retention-days: 14
