name: Pinewood Builder shelf and bench surfaces
on:
  pull_request:
    branches: [main]
    paths:
      - 'builder/**'
      - 'scripts/inspect-builder-shelf-bench-v1.mjs'
      - '.github/workflows/pinewood-builder-surface-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve locally vendored assets
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/surface-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/LICENSES.md >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Inspect material color under both lighting modes
        run: node scripts/inspect-builder-shelf-bench-v1.mjs
