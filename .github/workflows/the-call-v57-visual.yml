name: The Call v57 straight-thumb base-pivot visual
on:
  push:
    branches: [fix/the-call-v57-base-pivot-thumb, main]
    paths:
      - 'scripts/smoke-thumb-v57.mjs'
      - 'opening/makehuman-forearm-v57.js'
      - 'opening/phone-v45.js'
      - 'opening/intro.js'
      - 'review/the-call-v34/index.html'
      - '.github/workflows/the-call-v57-visual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/smoke-thumb-v57.mjs'
      - 'opening/makehuman-forearm-v57.js'
      - 'opening/phone-v45.js'
      - 'opening/intro.js'
      - 'review/the-call-v34/index.html'
      - '.github/workflows/the-call-v57-visual.yml'
permissions:
  contents: read
jobs:
  thumb-base-pivot:
    name: thumb-base-${{ matrix.layout }}
    strategy:
      fail-fast: false
      matrix:
        layout: [mobile, narrow, desktop]
    env:
      V57_LAYOUT: ${{ matrix.layout }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original skinned forearm and test syntax
        run: |
          node scripts/audit-call-right-forearm-v54.mjs
          node --check scripts/smoke-thumb-v57.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start deterministic opening preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v57-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/review/the-call-v34/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Prove straight thumb pivots at hand, taps and returns without clipping
        run: node scripts/smoke-thumb-v57.mjs
      - name: Upload actual mobile thumb frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v57-base-thumb-${{ matrix.layout }
          path: opening-v57-artifacts/
          retention-days: 7
