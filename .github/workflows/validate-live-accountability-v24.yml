name: Validate live Chapter 5 Accountability v24

on:
  push:
    branches: [promote-chapter5-accountability-v24]
    paths:
      - 'game.js'
      - 'patches/chapter5-accountability-v24.js.txt'
      - 'story/**'
      - 'scripts/audit-chapter3-security-readability-v22d.mjs'
      - 'scripts/audit-chapter4-east-wing-v23.mjs'
      - 'scripts/audit-chapter4-east-wing-readability-v23b.mjs'
      - 'scripts/audit-chapter5-accountability-v24.mjs'
      - 'scripts/capture-accountability-v24.mjs'
      - '.github/workflows/validate-live-accountability-v24.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-live-accountability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live v24 source and loader chain
        run: node scripts/audit-chapter5-accountability-v24.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinewood-v24-http.log 2>&1 &
          echo $! > /tmp/pinewood-v24-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pinewood-v24-http.log
          exit 1
      - name: Capture live Accountability views
        run: node scripts/capture-accountability-v24.mjs
      - name: Upload Accountability screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-accountability-v24-live-candidate
          path: accountability-artifacts
          if-no-files-found: warn
          retention-days: 14
