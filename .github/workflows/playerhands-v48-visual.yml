name: The Call legacy v48 source forearm archival QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hands:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual locally vendored arm and JS syntax
        run: |
          test -s opening/assets/v48/playerhands-forearm.glb
          test -s opening/assets/v48/manifest.json
          node --check opening/playerhands-v48.js
          node --check opening/phone-v45.js
          node --check opening/intro.js
          node --check scripts/smoke-playerhands-v48.mjs
      - name: Install deterministic Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve game and source forearm locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v48-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/review/the-call-v34/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pinewood-v48-http.log
          exit 1
      - name: Capture genuine CC0 forearm holding phone and thumb physically tapping button
        run: node scripts/smoke-playerhands-v48.mjs
      - name: Save exact arm pose screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-call-v48-source-forearm
          path: opening-v48-focus-artifacts/
          retention-days: 7
