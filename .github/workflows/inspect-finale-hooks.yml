name: Inspect finale hooks

on:
  push:
    branches: [chapter6-last-shift-v25]
    paths:
      - '.github/workflows/inspect-finale-hooks.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter6-last-shift-v25
      - name: Print Attendant and ending hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip
          parts=['bundle2/part-01.txt','bundle2/part-02.txt','bundle2/part-03.txt','bundle2/p4-1.txt','bundle2/p4-2.txt','bundle2/p4-3.txt','bundle2/p4-4.txt','bundle2/p4-5.txt','bundle2/p5-1.txt','bundle2/p5-2.txt','bundle2/p5-3.txt','bundle2/p5-4.txt','bundle2/p5-5.txt']
          payload=''.join(Path(p).read_text().strip() for p in parts)
          src=gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          for marker,span in [('class Attendant',14000),('winChapter(){',7000),('showEnding',7000),('ending',4000)]:
              i=src.find(marker)
              print('\n===== MARKER',repr(marker),'INDEX',i,'=====')
              if i>=0: print(src[i:i+span])
          PY
      - name: Remove inspection workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/inspect-finale-hooks.yml
          git commit -m 'Remove temporary finale hook inspection'
          git push origin HEAD:chapter6-last-shift-v25
