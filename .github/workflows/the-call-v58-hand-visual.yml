name: The Call v60 phone-to-webbing alignment and full-skin clearance
on:
  push:
    branches: [fix/the-call-v58-full-hand-case-clearance, fix/the-call-v59-phone-thumb-base-fit, fix/the-call-v60-phone-webbing-grip, main]
    paths:
      - 'scripts/smoke-hand-grip-v58.mjs'
      - 'opening/makehuman-forearm-v58.js'
      - 'opening/phone-v58.js'
      - 'opening/phone-v59.js'
      - 'opening/phone-v60.js'
      - 'opening/intro-v58.js'
      - 'opening/intro-v59.js'
      - 'opening/intro-v60.js'
      - 'review/the-call-v34/index.html'
      - '.github/workflows/the-call-v58-hand-visual.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/smoke-hand-grip-v58.mjs'
      - 'opening/makehuman-forearm-v57.js'
      - 'review/the-call-v34/index.html'
      - '.github/workflows/the-call-v58-hand-visual.yml'
permissions:
  contents: read
jobs:
  full-hand-clearance:
    name: full-hand-${{ matrix.layout }}
    strategy:
      fail-fast: false
      matrix:
        layout: [desktop, mobile]
    env:
      V58_LAYOUT: ${{ matrix.layout }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original skinned forearm and test syntax
        run: |
          node scripts/audit-call-right-forearm-v54.mjs
          node --check scripts/smoke-hand-grip-v58.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start deterministic opening preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v58-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/review/the-call-v34/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify all source skin clears case and handset fits native thumb base
        run: node scripts/smoke-hand-grip-v58.mjs
      - name: Upload actual full-hand collision frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v58-full-hand-${{ matrix.layout }}
          path: opening-v58-artifacts/
          retention-days: 7
