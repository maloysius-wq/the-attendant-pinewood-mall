name: Pinewood v101 one-time verified plant and calendar source delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pinewood-v101-default-branch-vendor-once.yml']
permissions:
  contents: write
jobs:
  archive-to-isolated-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-v101-mood-calendar-plants-selection
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: pip install Pillow==11.3.0
      - name: Download actual original licensed CC0 GLBs and PD photographs
        run: python tools/vendor-mood-v101.py
      - name: Pin generated archives to preexisting feature branch only, never main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/builder/mood-v101/
          git diff --cached --stat
          test -f assets/vendor/builder/mood-v101/manifest-v101.json
          test -f assets/vendor/builder/mood-v101/models/haworthia.glb
          test -f assets/vendor/builder/mood-v101/calendars/facilities-year-planner.png
          git commit -m "Pin verified source CC0 plant GLBs and authentic PD calendar photo-derived artwork"
          git fetch origin feat/builder-v101-mood-calendar-plants-selection
          git rebase origin/feat/builder-v101-mood-calendar-plants-selection
          git push origin HEAD:feat/builder-v101-mood-calendar-plants-selection
