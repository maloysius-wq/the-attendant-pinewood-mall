name: Pin new CC0 Builder finishes (development only)
on:
  push:
    branches:
      - feat/builder-placement-room-finishes-era-props-v87
    paths:
      - 'tools/vendor-builder-finishes-v87.mjs'
      - '.github/workflows/vendor-builder-finishes-v87.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-placement-room-finishes-era-props-v87
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin actual Poly Haven CC0 1k room finish albedo maps
        run: node tools/vendor-builder-finishes-v87.mjs
      - name: Commit source bytes and SHA-256 provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/builder/finishes/
          if ! git diff --cached --quiet; then
            git commit -m "assets(builder): pin six licensed CC0 room finish maps"
            git push origin HEAD:feat/builder-placement-room-finishes-era-props-v87
          fi
