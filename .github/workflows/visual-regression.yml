name: Store visual regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'index.html'
      - 'patches/**'
      - 'scripts/capture-store-visuals.mjs'
      - '.github/workflows/visual-regression.yml'

permissions:
  contents: read

jobs:
  capture-store-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          python3 -m http.server 4173 >/tmp/pinewood-http.log 2>&1 &
          echo $! > /tmp/pinewood-http.pid
          sleep 2
      - name: Capture deterministic store views
        run: node scripts/capture-store-visuals.mjs
      - name: Upload screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-store-visuals
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 14

