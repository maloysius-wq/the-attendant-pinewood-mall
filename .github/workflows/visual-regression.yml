name: Store visual regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'index.html'
      - 'patches/**'
      - 'scripts/capture-store-visuals.mjs'
      - '.github/workflows/visual-regression.yml'
      - 'vendor/**'
      - 'assets/vendor/**'

permissions:
  contents: write

jobs:
  capture-store-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure pinned Three.js core is local
        run: |
          set -euo pipefail
          mkdir -p vendor/three/build
          if [ ! -f vendor/three/build/three.core.js ]; then
            curl --fail --location --retry 3 \
              https://raw.githubusercontent.com/mrdoob/three.js/r180/build/three.core.js \
              --output vendor/three/build/three.core.js
          fi
          echo "Three.js core bytes: $(wc -c < vendor/three/build/three.core.js)"
          test "$(git hash-object vendor/three/build/three.core.js)" = "7dcd0fbcbc04b8d9a20ecb96c1ce344cb55150d5"
          if ! git diff --quiet -- vendor/three/build/three.core.js || [ -z "$(git ls-files vendor/three/build/three.core.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vendor/three/build/three.core.js
            git commit -m "Vendor Three.js r180 core dependency"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          test -f "$GITHUB_WORKSPACE/vendor/three/build/three.module.js"
          test -f "$GITHUB_WORKSPACE/vendor/three/build/three.core.js"
          test -f "$GITHUB_WORKSPACE/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          test -f "$GITHUB_WORKSPACE/vendor/pako/pako.esm.mjs"
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/pinewood-http.log 2>&1 &
          echo $! > /tmp/pinewood-http.pid
          sleep 2
          curl --fail --silent --show-error --head http://127.0.0.1:4173/vendor/three/build/three.module.js
          curl --fail --silent --show-error --head http://127.0.0.1:4173/vendor/three/build/three.core.js
          curl --fail --silent --show-error --head http://127.0.0.1:4173/vendor/three/examples/jsm/loaders/GLTFLoader.js
          curl --fail --silent --show-error --head http://127.0.0.1:4173/vendor/pako/pako.esm.mjs
      - name: Capture deterministic store views
        run: node scripts/capture-store-visuals.mjs
      - name: Upload screenshots and telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-store-visuals
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 14
