name: Pinewood V137 Chapter 1 source audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inspect-chapter1-runtime-v137.mjs'
      - 'scripts/test-chapter1-objectives-v137.mjs'
      - 'mall/chapter1-objectives-v137.js'
      - 'game.js'
      - 'scripts/smoke-chapter1-workorder-v137.mjs'
      - '.github/workflows/chapter1-clarity-v137.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chapter1-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect original Chapter 1 objective and safety hooks
        run: node scripts/inspect-chapter1-runtime-v137.mjs
      - name: Verify Chapter 1 objective state, real key pickup, blocked exit and later chapters
        run: |
          node --check mall/chapter1-workorder-v137.js
          node --test scripts/test-chapter1-objectives-v137.mjs
      - name: Audit original Chapter 1 canon and staged PCAS dialogue
        run: |
          node scripts/audit-chapter1-story-v18.mjs
          node scripts/audit-chapter1-pcas-v20.mjs

  chapter1-real-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve authored original game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v137-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify actual A/B/C, Master Service Key and freight departure gate
        run: node scripts/smoke-chapter1-workorder-v137.mjs
      - name: Save 1440x900 real Chapter 1 gameplay screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v137-chapter1-real-gameplay
          path: artifacts/v137-ch1-workorder/
          retention-days: 14
