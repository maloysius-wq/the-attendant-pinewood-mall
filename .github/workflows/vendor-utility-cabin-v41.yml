name: Vendor isolated CC0 utility truck cabin v41
on:
  push:
    branches: [fix/the-call-v41-truck-cabin-only]
    paths:
      - 'scripts/vendor-utility-cabin-v41.mjs'
      - '.github/workflows/vendor-utility-cabin-v41.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/the-call-v41-truck-cabin-only
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download CC0 truck interior and validate GLB
        run: node scripts/vendor-utility-cabin-v41.mjs
      - name: Commit downloaded model to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opening/assets/v41/
          git diff --cached --quiet && exit 0
          git commit -m "Vendor verified CC0 utility truck cabin for v41"
          git push origin HEAD:fix/the-call-v41-truck-cabin-only
