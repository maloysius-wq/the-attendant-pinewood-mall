name: Account Artifact Storage Audit
on:
  push:
    branches:
      - maintenance/storage-audit-20261016
    paths:
      - .github/workflows/account-artifact-storage-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: List artifacts and storage, read only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.github.com/repos/'+process.env.REPOSITORY+'/actions/artifacts';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'account-artifact-storage-audit'};
          if(process.env.GITHUB_REF_NAME!=='maintenance/storage-audit-20261016')throw Error('Unexpected branch');
          const all=[];
          for(let page=1;page<=100;page++){
            const r=await fetch(base+'?per_page=100&page='+page,{headers});
            if(!r.ok)throw Error('Artifact listing failed: HTTP '+r.status+' '+(await r.text()).slice(0,250));
            const data=await r.json();
            all.push(...data.artifacts);
            if(data.artifacts.length<100)break;
            if(page===100)throw Error('Artifact list > 10000; inventory incomplete');
          }
          const nonExpired=all.filter(a=>!a.expired);
          const sum=xs=>xs.reduce((n,a)=>n+a.size_in_bytes,0);
          const grouped=Object.values(nonExpired.reduce((m,a)=>{const k=a.name;m[k]??={name:k,count:0,bytes:0,latest:''};m[k].count++;m[k].bytes+=a.size_in_bytes;if(a.created_at>m[k].latest)m[k].latest=a.created_at;return m;},{})).sort((a,b)=>b.bytes-a.bytes);
          console.log('INVENTORY_SUMMARY '+JSON.stringify({repo:process.env.REPOSITORY,count:nonExpired.length,bytes:sum(nonExpired),expiredCount:all.length-nonExpired.length,oldest:nonExpired.map(a=>a.created_at).sort()[0]??null,newest:nonExpired.map(a=>a.created_at).sort().at(-1)??null}));
          for(const g of grouped.slice(0,70))console.log('INVENTORY_GROUP '+JSON.stringify(g));
          for(const a of [...nonExpired].sort((a,b)=>b.size_in_bytes-a.size_in_bytes).slice(0,95))console.log('INVENTORY_ARTIFACT '+JSON.stringify({id:a.id,name:a.name,bytes:a.size_in_bytes,created_at:a.created_at,expires_at:a.expires_at,run_id:a.workflow_run?.id}));
          NODE
