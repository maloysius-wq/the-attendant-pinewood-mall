name: Pinewood V144 Original Chapter 1 Environmental Cues
on:
  push:
    branches: [feature/v144-physical-stealth-cues]
    paths:
      - 'game.js'
      - 'mall/chapter1-atmosphere-v144.js'
      - 'mall/chapter1-atmosphere-v144.mjs'
      - 'scripts/test-chapter1-atmosphere-v144.mjs'
      - 'scripts/smoke-chapter1-atmosphere-v144.mjs'
      - '.github/workflows/chapter1-atmosphere-v144.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical original walls, pinned sounds and existing stealth regressions
        run: |
          node --check mall/chapter1-atmosphere-v144.js
          node --check mall/chapter1-atmosphere-v144.mjs
          node --test scripts/test-chapter1-atmosphere-v144.mjs
          node --test scripts/test-wall-panels-v141.mjs
          node --test scripts/test-chapter1-stealth-v139.mjs
          node --test scripts/test-chapter1-recovery-v140.mjs
          node scripts/audit-local-assets-v15.mjs
  genuine-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original 1440x900 desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve only repository-local runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v144-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Genuine E door and physical Game.tryMove to wall clues
        run: node scripts/smoke-chapter1-atmosphere-v144.mjs
      - name: Save authentic first-person wall captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v144-source-environment-1440x900
          path: artifacts/v144-original-wall-cues/
          retention-days: 14
