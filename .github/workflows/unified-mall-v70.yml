name: Unified Pinewood desktop gameplay migration
on:
  pull_request:
    paths:
      - 'mall/**'
      - 'patches/unified-mall-v70.js.txt'
      - 'game.js'
      - 'index.html'
      - 'scripts/test-opening-handoff-v70.mjs'
      - 'scripts/test-gameplay-layout-v70.mjs'
      - '.github/workflows/unified-mall-v70.yml'
  push:
    branches: [main]
    paths:
      - 'mall/**'
      - 'patches/unified-mall-v70.js.txt'
      - 'game.js'
      - 'index.html'
      - 'scripts/test-opening-handoff-v70.mjs'
      - 'scripts/test-gameplay-layout-v70.mjs'
jobs:
  physical-world-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-gameplay-layout-v70.mjs scripts/test-story-placement-v70.mjs scripts/test-story-runtime-v70.mjs scripts/test-visual-anchors-v70.mjs scripts/test-opening-handoff-v70.mjs
      - run: node --test scripts/test-physical-shell-v67.mjs scripts/test-furnishing-v69.mjs
