name: Generate PCAS voice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'story/pa-lines.json'
      - 'scripts/generate-pcas-voice.mjs'
      - '.github/workflows/generate-pcas-voice.yml'

permissions:
  contents: write

jobs:
  generate-pcas-voice:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate distorted PCAS voice assets
        run: node scripts/generate-pcas-voice.mjs
      - name: Verify generated voice manifest
        run: |
          test -f assets/audio/pa/manifest.json
          node -e "const m=require('./assets/audio/pa/manifest.json'); if(m.version!==19||Object.keys(m.files||{}).length<19)process.exit(1); for(const x of Object.values(m.files)){if(!x.duration||!x.sha256)process.exit(1)}"
      - name: Commit generated local audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/pa
          if git diff --cached --quiet; then
            echo "PCAS voice assets are already current."
            exit 0
          fi
          git commit -m "Generate distorted PCAS voice assets"
          git pull --rebase origin main
          git push origin HEAD:main
