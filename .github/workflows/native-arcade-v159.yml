name: Pinewood V159 original game arcade traversal
on:
  push:
    branches: [feature/v159-sunburst-layout]
    paths:
      - 'mall/chapter1-traversal-v143.js'
      - 'scripts/smoke-native-arcade-v159.mjs'
      - 'mall/sunburst-arcade-plan-v126.mjs'
      - 'mall/gameplay-layout-v70.mjs'
      - 'mall/render-sunburst-arcade-v126.js'
      - 'mall/render-shell-v67.js'
      - 'mall/arcade-surface-art-v159.js'
      - '.github/workflows/native-arcade-v159.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check mall/chapter1-traversal-v143.js
          node --check scripts/smoke-native-arcade-v159.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve local assets
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v159-native-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Walk actual original game from vestibule to every arcade approach
        run: node scripts/smoke-native-arcade-v159.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v159-native-arcade
          path: artifacts/v159-native-arcade/
