name: Vendor The Call v37 CC0 atmosphere
on:
  push:
    branches: [feature/the-call-v37-cc0-atmosphere]
    paths:
      - 'scripts/vendor-opening-assets-v37.mjs'
      - '.github/workflows/vendor-opening-v37.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/the-call-v37-cc0-atmosphere
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire and inspect CC0 assets with local provenance
        run: node scripts/vendor-opening-assets-v37.mjs
      - name: Commit real vendored binary assets on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opening/assets/v37/
          git diff --cached --quiet && exit 0
          git commit -m "Vendor checked CC0 assets for opening v37"
          git push origin HEAD:feature/the-call-v37-cc0-atmosphere
