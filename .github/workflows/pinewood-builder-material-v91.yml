name: Pinewood Builder texture realism and cardboard source v93
on:
  pull_request:
    branches: [main]
    paths:
      - 'builder/**'
      - 'assets/vendor/builder/materials-v91/**'
      - 'scripts/test-builder-material-v91.mjs'
      - 'scripts/test-builder-material-v92.mjs'
      - 'scripts/inspect-builder-asset-sources-v93.mjs'
      - 'scripts/test-builder-cardboard-peripherals-v93.mjs'
      - 'assets/vendor/builder/materials-v93/**'
      - 'builder/material-scale-v92.mjs'
      - 'scripts/smoke-builder-material-v91.mjs'
      - 'scripts/audit-builder-materials-v91.mjs'
      - '.github/workflows/pinewood-builder-material-v91.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect original cardboard and input-device material anatomy
        run: node scripts/inspect-builder-asset-sources-v93.mjs
      - name: Verify all 50 pinned CC0 source images, multi-material semantics and generated UVs
        run: node --test scripts/test-builder-material-v91.mjs scripts/test-builder-material-v92.mjs scripts/test-builder-cardboard-peripherals-v93.mjs scripts/test-builder-v87.mjs
      - name: Preserve full existing CC0 GLB asset hashes and classification
        run: node --test scripts/audit-builder-assets-v1.mjs
      - name: Summarize real source meshes in all color-only GLBs
        run: node scripts/audit-builder-materials-v91.mjs
      - name: Install desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve repository-local Pinewood Builder materials
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v91-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/builder/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Desktop verify source-faithful keyboard mouse cardboard surfaces and finish persistence
        run: node scripts/smoke-builder-material-v91.mjs
