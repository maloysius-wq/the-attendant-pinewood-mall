name: Diagnose Chapter 5 Accountability v24 promotion

on:
  push:
    branches: [promote-chapter5-accountability-v24]
    paths:
      - '.github/workflows/promote-chapter5-v24.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture exact promotion failure
        run: |
          set +e
          python - <<'PY' > promotion-diagnostic.txt 2>&1
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          def replace_once(old,new,label):
            count=s.count(old)
            print(f'{label}: count={count}')
            if count!=1:
              raise SystemExit(f'{label}: expected exactly once, found {count}')
            return s.replace(old,new,1)
          line="const CHAPTER4_V23B_PATCH='./patches/chapter4-east-wing-readability-v23b.js.txt';"
          s=replace_once(line,line+"\nconst CHAPTER5_V24_PATCH='./patches/chapter5-accountability-v24.js.txt';",'v24 constant insertion')
          marker='\nfunction replaceFoodCourt(source,replacement){'
          runtime="\nasync function applyChapter5AccountabilityV24Runtime(source,patchText){\n  const patchUrl=URL.createObjectURL(new Blob([patchText+'\\nexport { applyChapter5AccountabilityV24 };\\n'],{type:'text/javascript'}));\n  try{const mod=await import(patchUrl);if(typeof mod.applyChapter5AccountabilityV24!=='function')throw new Error('Chapter 5 Accountability v24 patch did not export its patch function.');return mod.applyChapter5AccountabilityV24(source);}finally{URL.revokeObjectURL(patchUrl);}\n}\n"
          s=replace_once(marker,runtime+marker,'v24 runtime helper insertion')
          s=replace_once('chapter4V23Patch,chapter4V23BPatch,pcasVoiceManifestText','chapter4V23Patch,chapter4V23BPatch,chapter5V24Patch,pcasVoiceManifestText','v24 promise destructuring')
          s=replace_once('getText(CHAPTER4_V23_PATCH),getText(CHAPTER4_V23B_PATCH),getText(PCAS_VOICE_MANIFEST)','getText(CHAPTER4_V23_PATCH),getText(CHAPTER4_V23B_PATCH),getText(CHAPTER5_V24_PATCH),getText(PCAS_VOICE_MANIFEST)','v24 patch fetch')
          s=replace_once("  const source=chapter4V23BSource+'\\n//# sourceURL=pinewood-runtime.js\\n';","  const chapter5V24Source=await applyChapter5AccountabilityV24Runtime(chapter4V23BSource,chapter5V24Patch);\n  const source=chapter5V24Source+'\\n//# sourceURL=pinewood-runtime.js\\n';",'v24 final source chain')
          p.write_text(s)
          print('EDIT PASS')
          PY
          edit_status=$?
          echo "edit_status=$edit_status" >> promotion-diagnostic.txt
          if [ "$edit_status" -eq 0 ]; then
            node scripts/audit-chapter5-accountability-v24.mjs >> promotion-diagnostic.txt 2>&1
            audit_status=$?
          else
            audit_status=99
          fi
          echo "audit_status=$audit_status" >> promotion-diagnostic.txt
          git checkout -- game.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add promotion-diagnostic.txt
          git commit -m 'Capture v24 promotion diagnostic'
          git push origin HEAD:promote-chapter5-accountability-v24
          exit 0