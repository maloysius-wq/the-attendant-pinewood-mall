name: Promote Chapter 5 Accountability v24

on:
  push:
    branches: [promote-chapter5-accountability-v24]
    paths:
      - '.github/workflows/promote-chapter5-v24.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote v24 and repair prerequisite feed-forward audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('game.js')
          s=p.read_text()
          def replace_once(text,old,new,label):
            count=text.count(old)
            if count!=1:
              raise SystemExit(f'{label}: expected exactly once, found {count}')
            return text.replace(old,new,1)

          line="const CHAPTER4_V23B_PATCH='./patches/chapter4-east-wing-readability-v23b.js.txt';"
          s=replace_once(s,line,line+"\nconst CHAPTER5_V24_PATCH='./patches/chapter5-accountability-v24.js.txt';",'v24 constant insertion')
          marker='\nfunction replaceFoodCourt(source,replacement){'
          runtime="\nasync function applyChapter5AccountabilityV24Runtime(source,patchText){\n  const patchUrl=URL.createObjectURL(new Blob([patchText+'\\nexport { applyChapter5AccountabilityV24 };\\n'],{type:'text/javascript'}));\n  try{const mod=await import(patchUrl);if(typeof mod.applyChapter5AccountabilityV24!=='function')throw new Error('Chapter 5 Accountability v24 patch did not export its patch function.');return mod.applyChapter5AccountabilityV24(source);}finally{URL.revokeObjectURL(patchUrl);}\n}\n"
          s=replace_once(s,marker,runtime+marker,'v24 runtime helper insertion')
          s=replace_once(s,'chapter4V23Patch,chapter4V23BPatch,pcasVoiceManifestText','chapter4V23Patch,chapter4V23BPatch,chapter5V24Patch,pcasVoiceManifestText','v24 promise destructuring')
          s=replace_once(s,'getText(CHAPTER4_V23_PATCH),getText(CHAPTER4_V23B_PATCH),getText(PCAS_VOICE_MANIFEST)','getText(CHAPTER4_V23_PATCH),getText(CHAPTER4_V23B_PATCH),getText(CHAPTER5_V24_PATCH),getText(PCAS_VOICE_MANIFEST)','v24 patch fetch')
          s=replace_once(s,"  const source=chapter4V23BSource+'\\n//# sourceURL=pinewood-runtime.js\\n';","  const chapter5V24Source=await applyChapter5AccountabilityV24Runtime(chapter4V23BSource,chapter5V24Patch);\n  const source=chapter5V24Source+'\\n//# sourceURL=pinewood-runtime.js\\n';",'v24 final source chain')
          p.write_text(s)

          a=Path('scripts/audit-chapter3-security-readability-v22d.mjs')
          t=a.read_text()
          v23b="const v23b=loader.includes(\"const CHAPTER4_V23B_PATCH='./patches/chapter4-east-wing-readability-v23b.js.txt';\");"
          t=replace_once(t,v23b,v23b+"\nconst v24=loader.includes(\"const CHAPTER5_V24_PATCH='./patches/chapter5-accountability-v24.js.txt';\");",'v22d audit v24 detection')
          t=replace_once(t,'if(live){\n  for(const marker','if(live){\n  if(v24&&!v23b)fail(\'game.js cannot wire v24 without v23b\');\n  for(const marker','v22d audit v24 prerequisite')
          start=t.index('    if(v23b){')
          end=t.index('    }else if(!loader.includes("const source=chapter4V23Source+',start)
          new_block="""    if(v23b){
      for(const marker of ['async function applyChapter4EastWingReadabilityV23BRuntime(source,patchText)','getText(CHAPTER4_V23B_PATCH)','const chapter4V23BSource=await applyChapter4EastWingReadabilityV23BRuntime(chapter4V23Source,chapter4V23BPatch);'])if(!loader.includes(marker))fail('game.js invalid v23→v23b feed-forward marker: '+marker);
      if(loader.includes("const source=chapter4V23Source+'\\n//# sourceURL=pinewood-runtime.js\\n';"))fail('game.js still boots terminal v23 while v23b is present');
      if(v24){
        for(const marker of ['async function applyChapter5AccountabilityV24Runtime(source,patchText)','getText(CHAPTER5_V24_PATCH)','const chapter5V24Source=await applyChapter5AccountabilityV24Runtime(chapter4V23BSource,chapter5V24Patch);',"const source=chapter5V24Source+'\\n//# sourceURL=pinewood-runtime.js\\n';"])if(!loader.includes(marker))fail('game.js invalid v23b→v24 feed-forward marker: '+marker);
        if(loader.includes("const source=chapter4V23BSource+'\\n//# sourceURL=pinewood-runtime.js\\n';"))fail('game.js still boots terminal v23b while v24 is present');
      }else if(!loader.includes("const source=chapter4V23BSource+'\\n//# sourceURL=pinewood-runtime.js\\n';"))fail('game.js missing terminal v23b source marker');
"""
          t=t[:start]+new_block+t[end:]
          t=replace_once(t,"${v23b?'→V23B':''}","${v23b?'→V23B':''}${v24?'→V24':''}",'v22d audit status label')
          a.write_text(t)
          PY
          node scripts/audit-chapter5-accountability-v24.mjs
      - name: Commit live v24 promotion
        run: |
          set -euo pipefail
          rm -f promotion-diagnostic.txt
          git rm .github/workflows/promote-chapter5-v24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js scripts/audit-chapter3-security-readability-v22d.mjs promotion-diagnostic.txt
          git commit -m 'Promote Chapter 5 Accountability v24 live'
          git push origin HEAD:promote-chapter5-accountability-v24