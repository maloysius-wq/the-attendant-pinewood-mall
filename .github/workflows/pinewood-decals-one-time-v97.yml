name: Pinewood v97 one-time CC0 grime/decal source pinning
on:
  push:
    branches: [feat/builder-grime-decals-material-scale-v97]
    paths:
      - 'tools/vendor-builder-decals-v97.py'
      - '.github/workflows/pinewood-decals-one-time-v97.yml'
permissions:
  contents: write
jobs:
  vendor:
    if: github.repository == 'maloysius-wq/the-attendant-pinewood-mall'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-grime-decals-material-scale-v97
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow==11.3.0'
      - name: Vendor real CC0 ambientCG photos and transparently masked 36 stains
        run: python tools/vendor-builder-decals-v97.py
      - name: Commit immutable local source manifests and rendered RGBA decals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/builder/decals-v97/
          git diff --cached --quiet && exit 0
          git commit -m "Pin 36 local CC0 surface grime PNG decals from 7 ambientCG sources"
          git push origin HEAD:refs/heads/feat/builder-grime-decals-material-scale-v97
