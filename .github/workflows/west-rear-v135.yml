name: Pinewood V135 real original west rear service enclosure
on:
  pull_request:
    branches: [main]
    paths:
      - 'mall/west-rear-service-closure-v135.mjs'
      - 'mall/physical-shell-v67.mjs'
      - 'mall/render-shell-v67.js'
      - 'mall/original-west-rear-survey-v134.mjs'
      - 'scripts/test-west-rear-source-v135.mjs'
      - 'scripts/smoke-west-rear-v135.mjs'
      - 'review/mall-construction-v67/**'
      - '.github/workflows/west-rear-v135.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-west-rear-source-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original west rear source and all six chapters
        run: |
          node --check mall/west-rear-service-closure-v135.mjs
          node --check mall/physical-shell-v67.mjs
          node --check mall/render-shell-v67.js
          node --check review/mall-construction-v67/main.js
          node --check scripts/smoke-west-rear-v135.mjs
          node --test scripts/test-west-rear-source-v135.mjs scripts/test-original-west-rear-v134.mjs scripts/test-original-residual-register-v134.mjs scripts/test-front-service-closure-v133.mjs scripts/test-vestibule-handoff-v112.mjs scripts/test-physical-shell-v67.mjs scripts/test-gameplay-layout-v70.mjs
      - name: Preserve locally verified licensed original source assets
        run: node scripts/audit-local-assets-v15.mjs
      - name: Install original desktop Chromium WebGL
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve original single authored property
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v135-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/review/mall-construction-v67/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Capture six real 1440x900 original back-of-house source views
        run: node scripts/smoke-west-rear-v135.mjs
      - name: Retain actual original source WebGL PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v135-real-original-west-rear
          path: artifacts/v135-west-rear-original/
          retention-days: 14
