name: Final dark-scene readability v26

on:
  push:
    branches: [production-hardening-pass-v26]
    paths:
      - '.github/workflows/final-darkness-tune-v26.yml'
      - 'scripts/final-darkness-tune-v26.py'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening-pass-v26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final dark-scene correction
        run: python3 scripts/final-darkness-tune-v26.py
      - name: Syntax and reconstructed runtime sanity
        run: |
          cp patches/production-readability-v26.js.txt /tmp/production-readability-v26.mjs
          node --check /tmp/production-readability-v26.mjs
          node scripts/audit-runtime.mjs
          grep -q "darkSceneReadabilityApproved:true" patches/production-readability-v26.js.txt
          grep -q "below-grade-loading-fill" patches/production-readability-v26.js.txt
      - name: Commit final visual correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches/production-readability-v26.js.txt
          git diff --cached --check
          git commit -m 'Correct final dark-scene readability from pixel review'
          git push origin HEAD:production-hardening-pass-v26
