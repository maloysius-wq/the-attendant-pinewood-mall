name: Pinewood v115 authentic shopfront architecture
on:
  pull_request:
    branches: [main]
    paths:
      - 'mall/storefront-plan-v115.mjs'
      - 'mall/render-storefronts-v115.js'
      - 'mall/physical-shell-v67.mjs'
      - 'mall/render-shell-v67.js'
      - 'mall/gameplay-layout-v70.mjs'
      - 'builder/room-wall-layout-v90.mjs'
      - 'review/mall-construction-v67/main.js'
      - 'scripts/test-storefronts-v115.mjs'
      - 'scripts/smoke-storefronts-v115.mjs'
      - '.github/workflows/storefront-v115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-world-retail:
    if: github.repository == 'maloysius-wq/the-attendant-pinewood-mall'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate actual physical retail walls, game paths, sources and doors
        run: |
          node --check mall/storefront-plan-v115.mjs
          node --check mall/render-storefronts-v115.js
          node --check mall/physical-shell-v67.mjs
          node --check mall/render-shell-v67.js
          node --check mall/gameplay-layout-v70.mjs
          node --check builder/room-wall-layout-v90.mjs
          node --check review/mall-construction-v67/main.js
          node --test scripts/test-storefronts-v115.mjs scripts/test-physical-shell-v67.mjs scripts/test-architecture-v114.mjs scripts/test-gameplay-layout-v70.mjs scripts/test-vestibule-handoff-v112.mjs
          node scripts/audit-local-assets-v15.mjs
      - name: Install real desktop Chromium WebGL
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve repository source and pinned 3D assets
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-v115-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/review/mall-construction-v67/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify glazed architecture and source-pinned signs in actual desktop WebGL
        run: node scripts/smoke-storefronts-v115.mjs
      - name: Retain eye-level storefront render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-real-storefronts-desktop
          path: artifacts/v115-storefronts/
          retention-days: 14
