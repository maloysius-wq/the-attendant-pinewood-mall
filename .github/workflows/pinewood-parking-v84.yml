name: Pinewood cinematic parking-lot v84
on:
  pull_request:
    branches: [main]
    paths:
      - 'opening/scene.js'
      - 'opening/parking-*-v84.*'
      - 'builder/exterior-scene.js'
      - 'scripts/test-parking-v84.mjs'
      - 'scripts/test-parking-tree-sightlines-v86.mjs'
      - 'scripts/smoke-parking-v84.mjs'
      - '.github/workflows/pinewood-parking-v84.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parking:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check painted lot plan and verified CC0 originals
        run: node --test scripts/test-parking-v84.mjs scripts/test-parking-tree-sightlines-v86.mjs scripts/test-builder-parking-v1.mjs
      - name: Check every locally pinned CC0 asset
        run: node --test scripts/audit-builder-assets-v1.mjs
      - name: Install desktop Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Serve actual cinematic and Builder assets
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pinewood-parking-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Verify actual lot in desktop WebGL Builder
        run: node scripts/smoke-parking-v84.mjs
