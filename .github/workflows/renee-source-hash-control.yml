name: Renee source hash control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renee-source-hash-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare old and fresh Renee preview sources
        shell: bash
        run: |
          set -euxo pipefail
          old_start='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9312751d-6481-4c1e-a39e-94f9b590931f.mp3'
          fresh_start='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6179e3c7-5c72-462c-bebc-99088d3daf87.mp3'
          old_first='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/dc07d2c7-4c76-4992-935f-bd545f97e262.mp3'
          fresh_first='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/51cc93b4-fcea-43d7-9fa3-3628140ede92.mp3'
          curl -fL --retry 2 "$old_start" -o /tmp/old-start.mp3
          curl -fL --retry 2 "$fresh_start" -o /tmp/fresh-start.mp3
          curl -fL --retry 2 "$old_first" -o /tmp/old-first.mp3
          curl -fL --retry 2 "$fresh_first" -o /tmp/fresh-first.mp3
          stat -c '%n %s bytes' /tmp/old-start.mp3 /tmp/fresh-start.mp3 /tmp/old-first.mp3 /tmp/fresh-first.mp3
          sha256sum /tmp/old-start.mp3 /tmp/fresh-start.mp3 /tmp/old-first.mp3 /tmp/fresh-first.mp3
