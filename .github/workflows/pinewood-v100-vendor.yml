name: Pinewood v100 one-time source archive
on:
  push:
    branches: [feat/builder-v100-weathered-wall-decor]
    paths: ['.github/workflows/pinewood-v100-vendor.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.3.0
      - name: Vendor source CC0 models and artist poster material
        run: python tools/vendor-wall-decay-v100.py
      - name: Commit source binaries to isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/builder/wall-decay-v100/
          git diff --cached --stat
          test -f assets/vendor/builder/wall-decay-v100/manifest-v100.json
          git commit -m "Vendor original CC0 whiteboard corkboard and damaged posters with hashes"
          git push origin HEAD:feat/builder-v100-weathered-wall-decor
