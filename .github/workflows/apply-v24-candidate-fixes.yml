name: Apply Chapter 5 v24 candidate fixes

on:
  push:
    branches: [promote-chapter5-accountability-v24]
    paths:
      - '.github/workflows/apply-v24-candidate-fixes.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply proven v24 runtime, audit, capture, and readability fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old,new,1)

          patch=Path('patches/chapter5-accountability-v24.js.txt')
          s=patch.read_text()
          replacements=[
              ("type:'ch5_roster_terminal_v24'", "'ch5_roster_terminal_v24','FINAL SHIFT ROSTER'", 'roster self-check'),
              ("type:'ch5_sessions_terminal_v24'", "'ch5_sessions_terminal_v24','CONTRACTOR SESSIONS'", 'sessions self-check'),
              ("this.storyV17.evidence('LS-07'", "game.storyV17.evidence('LS-07'", 'LS-07 self-check'),
              ("  window.__PINEWOOD_CH5_V24__.sceneBuilt=true;\n}\n`);", "  window.__PINEWOOD_CH5_V24__.sceneBuilt=true;\n}\n\nasync function decorateLevel(world,idx){\n`);", 'decorateLevel declaration'),
              ("ctx.fillStyle='#171917';ctx.fillRect(0,0,c.width,c.height);", "ctx.fillStyle='#222823';ctx.fillRect(0,0,c.width,c.height);", 'terminal background readability'),
              ("ctx.fillStyle='#c8c2a8';ctx.textAlign='center';", "ctx.fillStyle='#e3dcc3';ctx.textAlign='center';", 'terminal title readability'),
              ("ctx.fillStyle=i===0?accent:'#a9aa9b';", "ctx.fillStyle=i===0?accent:'#d0d1c2';", 'terminal body readability'),
              ("screenMat=new THREE.MeshStandardMaterial({map:accountabilityPanelTextureV24(title,['SYSTEM READY']),emissive:0x1c3328,emissiveIntensity:.62,roughness:.30});", "screenMat=new THREE.MeshStandardMaterial({map:accountabilityPanelTextureV24(title,['SYSTEM READY']),emissive:0x315b48,emissiveIntensity:.95,roughness:.30});", 'terminal emissive readability'),
              ("const fill=new THREE.HemisphereLight(0x72786f,0x080808,.13);fill.userData.chapter5LightV24='records-ambient';world.root.add(fill);for(const[x,z,color,intensity,range,tag]of[[-22,12,0xc7c1a8,.82,6.5,'payroll'],[-8.5,12,0xaec5b2,1.05,7.2,'roster'],[6,12,0xd2c2a5,.88,6.2,'operations'],[22,12,0xa8b8ae,.86,6.2,'time-clock'],[-6,-15,0xa9b4aa,.70,5.0,'eli'],[11,-14,0xa6c4b2,.98,6.4,'sessions']])", "const fill=new THREE.HemisphereLight(0x72786f,0x080808,.20);fill.userData.chapter5LightV24='records-ambient';world.root.add(fill);for(const[x,z,color,intensity,range,tag]of[[-22,12,0xc7c1a8,1.12,8.0,'payroll'],[-8.5,12,0xaec5b2,1.38,8.8,'roster'],[6,12,0xd2c2a5,1.18,7.8,'operations'],[22,12,0xa8b8ae,1.16,7.8,'time-clock'],[-6,-15,0xa9b4aa,1.35,8.0,'eli'],[11,-14,0xa6c4b2,1.30,8.0,'sessions']])", 'records lighting readability'),
          ]
          for old,new,label in replacements:
              s=replace_once(s,old,new,label)
          patch.write_text(s)

          audit=Path('scripts/audit-chapter5-accountability-v24.mjs')
          a=audit.read_text()
          a=replace_once(a,"this.storyV17.evidence('LS-07'","game.storyV17.evidence('LS-07'",'v24 audit LS-07 marker')
          audit.write_text(a)

          capture=Path('scripts/capture-accountability-v24.mjs')
          c=capture.read_text()
          c=replace_once(c,"&&state.chapter4?.version===23&&state.chapter4?.visualReadability===true&&ch5?.version===24","&&state.visual?.view===view&&ch5?.version===24",'Chapter 5 browser state invariant')
          capture.write_text(c)
          PY
      - name: Verify corrected v24 source and loader chain
        run: node scripts/audit-chapter5-accountability-v24.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinewood-v24-http.log 2>&1 &
          echo $! > /tmp/pinewood-v24-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pinewood-v24-http.log
          exit 1
      - name: Capture corrected Accountability views
        run: node scripts/capture-accountability-v24.mjs
      - name: Upload corrected Accountability screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinewood-accountability-v24-repaired
          path: accountability-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Commit repaired v24 candidate
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/chapter5-accountability-v24.js.txt scripts/audit-chapter5-accountability-v24.mjs scripts/capture-accountability-v24.mjs
          git commit -m "Repair and brighten Chapter 5 Accountability v24"
          git push origin HEAD:promote-chapter5-accountability-v24
