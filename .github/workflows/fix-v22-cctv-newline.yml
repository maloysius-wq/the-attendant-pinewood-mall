name: Fix v22 CCTV newline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v22-cctv-newline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve newline escape through staged patch template
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('patches/chapter3-eyes-security-v22.js.txt')
          s=p.read_text()
          old="feed.label+'\\n'+(seen?'MOTION: FIGURE IN FRAME':'NO MOVEMENT DETECTED')"
          new="feed.label+'\\\\n'+(seen?'MOTION: FIGURE IN FRAME':'NO MOVEMENT DETECTED')"
          if old not in s:
              raise SystemExit('Expected v22 CCTV newline marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches/chapter3-eyes-security-v22.js.txt
          git commit -m 'Fix v22 CCTV newline escaping'
          git push origin HEAD:main
