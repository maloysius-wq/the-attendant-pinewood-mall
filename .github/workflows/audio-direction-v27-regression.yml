name: Audio Direction v27 regression

on:
  push:
    branches: [main, audio-direction-v27]
    paths:
      - 'game.js'
      - 'patches/audio-direction-v27.js.txt'
      - 'patches/production-readability-v26.js.txt'
      - 'assets/audio/pa/**'
      - 'assets/audio/characters/**'
      - 'story/dialogue.js'
      - 'story/pa-lines-v27.json'
      - 'scripts/audit-audio-direction-v27.mjs'
      - 'scripts/audit-chapter3-security-readability-v22d.mjs'
      - 'scripts/audit-chapter6-last-shift-v25.mjs'
      - 'scripts/audit-production-readability-v26.mjs'
      - 'scripts/smoke-audio-direction-v27.mjs'
      - 'scripts/simulate-chapter6-finale-v25.mjs'
      - '.github/workflows/audio-direction-v27-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'game.js'
      - 'patches/audio-direction-v27.js.txt'
      - 'patches/production-readability-v26.js.txt'
      - 'assets/audio/pa/**'
      - 'assets/audio/characters/**'
      - 'story/dialogue.js'
      - 'story/pa-lines-v27.json'
      - 'scripts/audit-audio-direction-v27.mjs'
      - 'scripts/audit-chapter3-security-readability-v22d.mjs'
      - 'scripts/audit-chapter6-last-shift-v25.mjs'
      - 'scripts/audit-production-readability-v26.mjs'
      - 'scripts/smoke-audio-direction-v27.mjs'
      - 'scripts/simulate-chapter6-finale-v25.mjs'
      - '.github/workflows/audio-direction-v27-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v27 source, manifests, cadence and loader chain
        run: |
          node scripts/audit-audio-direction-v27.mjs
          node scripts/audit-production-readability-v26.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Pinewood server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pinewood-v27-http.log 2>&1 &
          echo $! > /tmp/pinewood-v27-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pinewood-v27-http.log
          exit 1
      - name: Smoke local v27 voice runtime and representative assets
        run: node scripts/smoke-audio-direction-v27.mjs
      - name: Re-run deterministic Chapter 6 finale under v27
        run: node scripts/simulate-chapter6-finale-v25.mjs
