name: Fix Chapter 6 ritual source

on:
  push:
    branches: [chapter6-last-shift-v25]
    paths:
      - '.github/workflows/fix-v25-ritual-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter6-last-shift-v25
      - name: Repair ritual telemetry, terminal facing and canonical dialogue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch_path=Path('patches/chapter6-last-shift-v25.js.txt')
          patch=patch_path.read_text()

          old="window.__PINEWOOD_CH6_V25__={version:25,lastShift:true,memoryOverlay:true,locationSpecific:true,staffSilhouettes:true,closingSequence:true,finalAccountability:false,sceneBuilt:false,memoryActive:false,memoryTransitions:0,lastTransition:'build',closingStage:lastShiftClosingStageV25(s)};"
          new="window.__PINEWOOD_CH6_V25__={version:25,lastShift:true,memoryOverlay:true,locationSpecific:true,staffSilhouettes:true,closingSequence:true,finalAccountability:false,sceneBuilt:false,memoryActive:false,memoryTransitions:0,lastTransition:'build',staffAcknowledged:!!s.staffAcknowledged,keyCleared:!!s.keyCleared,serviceCleared:!!s.serviceCleared,eliProcessed:!!s.eliProcessed,accountabilityOne:!!s.accountabilityOne,closingStage:lastShiftClosingStageV25(s)};"
          if patch.count(old)!=1: raise SystemExit(f'expected one telemetry marker, found {patch.count(old)}')
          patch=patch.replace(old,new)

          old_stations="s.rosterStation=makeLastShiftRitualStationV25(world,new THREE.Vector3(-5.2,.02,12.5),0,'ch6_roster_station_v25','STAFF ACCOUNTABILITY','#9fc5a9');s.eliStation=makeLastShiftRitualStationV25(world,new THREE.Vector3(5.2,.02,12.5),0,'ch6_eli_station_v25','CONTRACTOR 01','#d2b374');"
          new_stations="s.rosterStation=makeLastShiftRitualStationV25(world,new THREE.Vector3(-5.2,.02,12.5),Math.PI,'ch6_roster_station_v25','STAFF ACCOUNTABILITY','#9fc5a9');s.eliStation=makeLastShiftRitualStationV25(world,new THREE.Vector3(5.2,.02,12.5),Math.PI,'ch6_eli_station_v25','CONTRACTOR 01','#d2b374');"
          if patch.count(old_stations)!=1: raise SystemExit(f'expected one front terminal marker, found {patch.count(old_stations)}')
          patch=patch.replace(old_stations,new_stations)

          runtime_rewrite="  replaceOnce('Chapter 6 accountability one dialogue text','ACCOUNTABILITY HOLD. STAFF STATUS UNRESOLVED. CONTRACTOR 14 SESSION ACTIVE.','ACCOUNTABILITY: 1. CONTRACTOR 14 SESSION ACTIVE. EXIT EVENT REQUIRED.');\n"
          if patch.count(runtime_rewrite)!=1: raise SystemExit(f'expected one runtime dialogue rewrite, found {patch.count(runtime_rewrite)}')
          patch=patch.replace(runtime_rewrite,'')
          patch_path.write_text(patch)

          dialogue_path=Path('story/dialogue.js')
          dialogue=dialogue_path.read_text()
          old_dialogue="ch6_accountability_one:{id:'ch6_accountability_one',speaker:'PCAS',medium:'terminal',text:'ACCOUNTABILITY HOLD. STAFF STATUS UNRESOLVED. CONTRACTOR 14 SESSION ACTIVE.'}"
          new_dialogue="ch6_accountability_one:{id:'ch6_accountability_one',speaker:'PCAS',medium:'terminal',text:'ACCOUNTABILITY: 1. CONTRACTOR 14 SESSION ACTIVE. EXIT EVENT REQUIRED.'}"
          if dialogue.count(old_dialogue)!=1: raise SystemExit(f'expected one canonical dialogue marker, found {dialogue.count(old_dialogue)}')
          dialogue_path.write_text(dialogue.replace(old_dialogue,new_dialogue))
          PY
      - name: Commit repairs and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-v25-ritual-source.yml
          git add patches/chapter6-last-shift-v25.js.txt story/dialogue.js
          git commit -m 'Repair Chapter 6 ritual telemetry and terminal facing'
          git push origin HEAD:chapter6-last-shift-v25
