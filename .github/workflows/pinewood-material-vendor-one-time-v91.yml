name: Pinewood material v91 source-vendoring (one-time)
on:
  push:
    branches: [feat/builder-material-library-v91]
    paths:
      - 'tools/vendor-builder-materials-v91.mjs'
      - '.github/workflows/pinewood-material-vendor-one-time-v91.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pin-cc0-source-files:
    if: github.repository == 'maloysius-wq/the-attendant-pinewood-mall'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/builder-material-library-v91
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official Poly Haven CC0 materials and vendor JPEG binaries locally
        run: node tools/vendor-builder-materials-v91.mjs
      - name: Commit pinned hashes and locally served images into feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/builder/materials-v91 builder/material-options-v91.mjs
          git diff --cached --quiet && { echo "No new materials"; exit 0; }
          git commit -m "Vendor verified Poly Haven CC0 finishes and multi-surface prop textures v91"
          git push origin HEAD:refs/heads/feat/builder-material-library-v91
