name: Renee source control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renee-source-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate duration-safe loudnorm and radio mix
        shell: bash
        run: |
          set -euxo pipefail
          src='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9312751d-6481-4c1e-a39e-94f9b590931f.mp3'
          curl -fL --retry 2 "$src" -o /tmp/in.mp3
          probe(){ ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$1"; }
          source_duration=$(probe /tmp/in.mp3)
          echo "SOURCE duration=$source_duration"
          core='aresample=44100,highpass=f=340,lowpass=f=2950,acompressor=threshold=0.070:ratio=5.4:attack=3:release=70,equalizer=f=900:t=q:w=1.0:g=1.8,equalizer=f=1850:t=q:w=0.9:g=4.4,acrusher=bits=13:mode=lin:aa=1:mix=0.040'
          broken="[0:a]${core},loudnorm=I=-20.0:LRA=4.5:TP=-2.0[voice];[1:a]highpass=f=600,lowpass=f=3800,volume=0.16[noise];[voice][noise]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.92,apad=pad_dur=0.14[out]"
          fixed_pre="[0:a]${core},loudnorm=I=-20.0:LRA=4.5:TP=-2.0,aresample=44100[voice];[1:a]aresample=44100,highpass=f=600,lowpass=f=3800,volume=0.16[noise];[voice][noise]amix=inputs=2:duration=first:dropout_transition=0:normalize=0,alimiter=limit=0.92,apad=pad_dur=0.14[out]"
          fixed_post="[0:a]${core}[voice];[1:a]aresample=44100,highpass=f=600,lowpass=f=3800,volume=0.16[noise];[voice][noise]amix=inputs=2:duration=first:dropout_transition=0:normalize=0,loudnorm=I=-20.0:LRA=4.5:TP=-2.0,aresample=44100,alimiter=limit=0.92,apad=pad_dur=0.14[out]"
          idx=0
          for fx in "$broken" "$fixed_pre" "$fixed_post"; do
            idx=$((idx+1))
            ffmpeg -hide_banner -loglevel error -y -i /tmp/in.mp3 -f lavfi -i 'anoisesrc=color=pink:amplitude=0.007:r=44100:seed=1' -filter_complex "$fx" -map '[out]' -ac 1 -ar 44100 -c:a libvorbis -q:a 5 "/tmp/v$idx.ogg"
            echo "VARIANT $idx duration=$(probe /tmp/v$idx.ogg)"
          done
          fixed_duration=$(probe /tmp/v2.ogg)
          node -e "const s=Number(process.argv[1]),o=Number(process.argv[2]); if(o+0.05<s) { console.error('duration-safe chain still truncates', {source:s, output:o}); process.exit(1); }" "$source_duration" "$fixed_duration"
