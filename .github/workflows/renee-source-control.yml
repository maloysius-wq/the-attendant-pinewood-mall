name: Renee source control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renee-source-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Isolate Renee render duration loss
        shell: bash
        run: |
          set -euxo pipefail
          src='https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/9312751d-6481-4c1e-a39e-94f9b590931f.mp3'
          curl -fL --retry 2 "$src" -o /tmp/in.mp3
          probe(){ ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$1"; }
          echo "SOURCE duration=$(probe /tmp/in.mp3)"
          filters=(
            'aresample=44100'
            'aresample=44100,highpass=f=340,lowpass=f=2950'
            'aresample=44100,highpass=f=340,lowpass=f=2950,acompressor=threshold=0.070:ratio=5.4:attack=3:release=70'
            'aresample=44100,highpass=f=340,lowpass=f=2950,acompressor=threshold=0.070:ratio=5.4:attack=3:release=70,equalizer=f=900:t=q:w=1.0:g=1.8,equalizer=f=1850:t=q:w=0.9:g=4.4'
            'aresample=44100,highpass=f=340,lowpass=f=2950,acompressor=threshold=0.070:ratio=5.4:attack=3:release=70,equalizer=f=900:t=q:w=1.0:g=1.8,equalizer=f=1850:t=q:w=0.9:g=4.4,acrusher=bits=13:mode=lin:aa=1:mix=0.040'
            'aresample=44100,highpass=f=340,lowpass=f=2950,acompressor=threshold=0.070:ratio=5.4:attack=3:release=70,equalizer=f=900:t=q:w=1.0:g=1.8,equalizer=f=1850:t=q:w=0.9:g=4.4,acrusher=bits=13:mode=lin:aa=1:mix=0.040,loudnorm=I=-20.0:LRA=4.5:TP=-2.0'
          )
          i=0
          for af in "${filters[@]}"; do
            i=$((i+1))
            ffmpeg -hide_banner -loglevel error -y -i /tmp/in.mp3 -af "$af" -ac 1 -ar 44100 -c:a libvorbis -q:a 5 "/tmp/stage-$i.ogg"
            echo "STAGE $i duration=$(probe /tmp/stage-$i.ogg) filter=$af"
          done
          core='aresample=44100,highpass=f=340,lowpass=f=2950,acompressor=threshold=0.070:ratio=5.4:attack=3:release=70,equalizer=f=900:t=q:w=1.0:g=1.8,equalizer=f=1850:t=q:w=0.9:g=4.4,acrusher=bits=13:mode=lin:aa=1:mix=0.040'
          variants=(
            "[0:a]${core}[voice];[1:a]highpass=f=600,lowpass=f=3800,volume=0.16[noise];[voice][noise]amix=inputs=2:duration=first:normalize=0[out]"
            "[0:a]${core},loudnorm=I=-20.0:LRA=4.5:TP=-2.0[voice];[1:a]highpass=f=600,lowpass=f=3800,volume=0.16[noise];[voice][noise]amix=inputs=2:duration=first:normalize=0[out]"
            "[0:a]${core}[voice];[1:a]highpass=f=600,lowpass=f=3800,volume=0.16[noise];[voice][noise]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.92,apad=pad_dur=0.14[out]"
            "[0:a]${core},loudnorm=I=-20.0:LRA=4.5:TP=-2.0[voice];[1:a]highpass=f=600,lowpass=f=3800,volume=0.16[noise];[voice][noise]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.92,apad=pad_dur=0.14[out]"
          )
          j=0
          for fx in "${variants[@]}"; do
            j=$((j+1))
            ffmpeg -hide_banner -loglevel error -y -i /tmp/in.mp3 -f lavfi -i 'anoisesrc=color=pink:amplitude=0.007:r=44100:seed=1' -filter_complex "$fx" -map '[out]' -ac 1 -ar 44100 -c:a libvorbis -q:a 5 "/tmp/mix-$j.ogg"
            echo "MIX $j duration=$(probe /tmp/mix-$j.ogg)"
          done
