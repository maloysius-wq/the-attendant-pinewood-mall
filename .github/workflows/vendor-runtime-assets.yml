name: Vendor runtime assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/vendor-runtime-assets.mjs'
      - 'scripts/apply-local-runtime-v15.mjs'
      - 'scripts/finalize-local-assets-v15-fixed.mjs'
      - 'scripts/patch-cassette-audits-v15.mjs'
      - 'scripts/sanitize-loader-v15.mjs'
      - 'patches/local-assets-v15.js.txt'
      - '.github/workflows/vendor-runtime-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-runtime-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor pinned browser libraries
        run: |
          npm install --no-save --package-lock=false three@0.180.0 pako@2.1.0
          rm -rf vendor/three vendor/pako
          mkdir -p vendor/three/build vendor/three/examples vendor/pako
          cp node_modules/three/build/three.module.js vendor/three/build/three.module.js
          cp -R node_modules/three/examples/jsm vendor/three/examples/jsm
          cp node_modules/pako/dist/pako.esm.mjs vendor/pako/pako.esm.mjs
      - name: Discover and vendor final runtime media
        run: node scripts/vendor-runtime-assets.mjs
      - name: Wire local runtime v15
        run: node scripts/apply-local-runtime-v15.mjs
      - name: Remove remote browser-library literals
        run: node scripts/sanitize-loader-v15.mjs
      - name: Normalize manifest and document permanent policy
        run: node scripts/finalize-local-assets-v15-fixed.mjs
      - name: Update inherited Cassette Castle audit handoff
        run: node scripts/patch-cassette-audits-v15.mjs
      - name: Commit localized runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/vendor/runtime vendor/three vendor/pako game.js index.html DEVELOPMENT_HANDOFF.md LICENSES.md scripts/audit-cassette-castle-v13.mjs scripts/audit-cassette-castle-v14.mjs
          if git diff --cached --quiet; then
            echo "Vendored and localized runtime files are already current."
            exit 0
          fi
          git commit -m "Finalize fully local runtime assets"
          git pull --rebase origin main
          git push origin HEAD:main
