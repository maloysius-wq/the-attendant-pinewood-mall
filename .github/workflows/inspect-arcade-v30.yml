name: Inspect Sunburst Arcade v30

on:
  push:
    paths:
      - 'scripts/inspect-arcade-v30.mjs'
      - '.github/workflows/inspect-arcade-v30.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-arcade-v30
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract current assembled arcade builder
        run: node scripts/inspect-arcade-v30.mjs
      - name: Commit diagnostic source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/arcade-current-source.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture current Sunburst Arcade source for v30 rebuild"
          git pull --rebase origin main
          git push origin HEAD:main
