name: Assemble Chapter 5 v24 staging package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-v24-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack staged package
        run: |
          set -euo pipefail
          cat .staging/v24/part* | base64 -d > /tmp/v24pkg.tgz
          echo '76f091dc37d8987400f142eba6d9b64a96471696fdd408e892b00ca261f9a0ef  /tmp/v24pkg.tgz' | sha256sum -c -
          tar -xzf /tmp/v24pkg.tgz
          node --check scripts/audit-chapter5-accountability-v24.mjs
          node --check scripts/capture-accountability-v24.mjs
      - name: Commit coherent staged v24 package
        run: |
          set -euo pipefail
          rm -rf .staging/v24
          rm .github/workflows/assemble-v24-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .staging .github/workflows/assemble-v24-staging.yml \
            patches/chapter5-accountability-v24.js.txt \
            scripts/audit-chapter5-accountability-v24.mjs \
            scripts/capture-accountability-v24.mjs \
            .github/workflows/diagnose-accountability-v24.yml \
            .github/workflows/staged-accountability-v24-regression.yml \
            story/dialogue.js
          git commit -m 'Stage Chapter 5 Accountability v24'
          git push origin HEAD:main
